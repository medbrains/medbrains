[package]
name = "r8r-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "r8r server: REST API, webhooks, scheduler and persistence"

[lib]
name = "r8r_cli"
path = "src/lib.rs"

[[bin]]
name = "r8r"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
r8r-workflow.workspace = true
r8r-core.workspace = true
r8r-nodes-base.workspace = true
axum.workspace = true
chrono.workspace = true
croner.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
include_dir = "0.7"
rand = "0.10.2"
async-trait = "0.1.92"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "time"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
