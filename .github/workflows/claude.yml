# Claude Code on pull requests: our own Gitar-style agent.
#
#   1. "@claude ..." in a PR or review comment: answers or makes the change asked
#      for, as commits on that PR's branch.
#   2. A failed CI run on a PR: reads the failing log, fixes the cause and
#      pushes a commit to the branch. It runs once per failed run and never on
#      drafts.
#
# It never merges, never pushes to main, and never acts for anyone without write
# access. Fork PRs are skipped. Its commits go through the same required checks
# and independent review as any other. It follows CLAUDE.md / ENGINEERING.md.
#
# Off until the owner adds CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) or
# ANTHROPIC_API_KEY as a repository secret. Until then every job skips.

name: Claude PR agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  on-mention:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       github.event.pull_request.head.repo.full_name == github.repository)
    name: Answer @claude
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip until a Claude token is set
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret; skipped."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          track_progress: true
          claude_args: --max-turns 60

  fix-ci:
    # Only same-repo PR branches (their authors have write access), only real
    # failures, never drafts, and never main.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != 'main' &&
      github.event.workflow_run.run_attempt == 1
    name: Fix the failed CI run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Skip until a Claude token is set
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret; skipped."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.HAS_TOKEN == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --max-turns 60
          prompt: |
            CI run ${{ github.event.workflow_run.id }} failed on branch ${{ github.event.workflow_run.head_branch }}.
            Read the failed jobs' logs with `gh run view ${{ github.event.workflow_run.id }} --log-failed`.
            Fix the root cause in the code on this branch, following CLAUDE.md and ENGINEERING.md:
            no weakened checks, no skipped tests, no baseline --update, no edits to generated files
            except by running their generator. Ignore the checks that are not required and fail on
            main too (Rust format, Schema + tenancy). Commit with a plain imperative message saying
            why, signed off, with no Co-Authored-By line, and push to this branch only. If the
            failure needs a human decision, or a baseline update, push nothing and comment on the
            PR explaining what is needed.
