# Asks every outside contributor to sign CLA.md before their pull request can merge.
# Signatures are stored in signatures/cla.json on the cla-signatures branch of this repo.
# pull_request_target is used so the bot can comment on PRs from forks; this workflow
# never checks out or runs code from the pull request.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: write # commit signatures to the cla-signatures branch
  pull-requests: write # comment on the pull request
  statuses: write # set the CLA status on the pull request
  actions: write # re-run the check after a contributor signs

jobs:
  cla:
    name: CLA signed
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/medbrains/medbrains/blob/main/CLA.md
          branch: cla-signatures
          allowlist: DomnicAmalan,Domnic-Alagappa,dependabot[bot]
          # Keep merged pull requests open for follow-up discussion.
          lock-pullrequest-aftermerge: false
