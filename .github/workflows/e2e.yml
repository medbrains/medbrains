# End-to-end journeys: the Playwright suite in medbrains/apps/web/e2e, run against a real
# server and a real PostgreSQL on the runner (no Docker, per the OS rule).
#
# Report-only. Journeys that have never run in CI are expected to fail at first; the run
# shows them (PR check + summary comment + HTML report artifact) without blocking a merge.
# Make it a required check only once its failures are paid down — the owner's call.
#
# One job builds the server; the shards download that binary, so the suite (~2,000 tests,
# one worker each) is split across machines without compiling the server once per shard.
# The build restores the dependency cache ci.yml's "Rust tests" job saves (same key and dev
# profile), so a warm build compiles only the workspace crates.
#
# The server is a debug build, so the e2e seed route (/api/debug/e2e/canonical-fixtures) is
# on and the first administrator is the dev seed's admin/admin123. Every shard has its own
# database. Every row is synthetic; no patient data exists on the runner.

name: E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ['release/**']
  schedule:
    # Nightly on the default branch.
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  server:
    # A draft PR spends no build; marking it ready for review runs it.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Build the server
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: medbrains
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Rust toolchain
        # rust-toolchain.toml pins the version.
        run: rustup toolchain install
      # Restore only: ci.yml's Rust tests job owns this cache and saves it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            medbrains/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('medbrains/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      # medbrains-printing links against CUPS.
      - run: sudo apt-get update && sudo apt-get install -y libcups2-dev
      - run: cargo build --locked -p medbrains-server --bin medbrains-server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-server
          path: medbrains/target/debug/medbrains-server
          if-no-files-found: error
          retention-days: 1

  playwright:
    needs: server
    name: Playwright shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: medbrains
    env:
      DATABASE_URL: postgres://medbrains:ci_only@localhost:5432/medbrains
      E2E_BASE_URL: http://localhost:5173
      E2E_BACKEND_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System packages and PostgreSQL
        run: bash scripts/ci_postgres.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-server
          path: medbrains/bin
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: medbrains/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: medbrains/.nvmrc
          cache: pnpm
          cache-dependency-path: medbrains/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The packages the web app and the specs import are consumed built.
      - run: pnpm turbo run build --filter=@medbrains/web^...
      - name: Chromium for Playwright
        run: pnpm --filter @medbrains/web exec playwright install --with-deps chromium

      # Migrates, seeds the default tenant and its administrator, then serves on :3000.
      - name: Start the server
        env:
          CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
          TRUSTED_PROXIES: 127.0.0.1/32,::1/128
          RUST_LOG: info
        run: |
          chmod +x bin/medbrains-server
          nohup bin/medbrains-server > server.log 2>&1 &
          for _ in $(seq 1 300); do
            curl -fsS http://127.0.0.1:3000/api/health > /dev/null 2>&1 && exit 0
            sleep 2
          done
          tail -200 server.log
          # What the server was waiting on, if it was the database.
          curl -sS http://127.0.0.1:3000/api/health || true
          psql "$DATABASE_URL" -c "SELECT count(*) AS migrations_applied FROM _sqlx_migrations" || true
          psql "$DATABASE_URL" -c "SELECT pid, state, wait_event_type, wait_event, left(query, 160) AS query FROM pg_stat_activity WHERE datname = 'medbrains'" || true
          echo "::error::The server did not answer /api/health within ten minutes"
          exit 1
      - name: Start the web app
        working-directory: medbrains/apps/web
        run: |
          nohup pnpm exec vite --host 127.0.0.1 --port 5173 > ../../vite.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -fsS http://localhost:5173/login > /dev/null 2>&1 && break
            sleep 2
          done
          # The dev server transforms on first request; warm the entry so the first journey
          # does not spend its timeout on it.
          curl -sS http://localhost:5173/src/main.tsx > /dev/null || true

      # Every project that runs against a live server. Not here: perf (on demand, against a
      # production build), payments-live (needs Razorpay test keys), and smoke/writes, whose
      # specs are generated locally and not committed.
      - name: Run Playwright
        # Report-only: failures go to the report job, not to this step's status.
        continue-on-error: true
        working-directory: medbrains/apps/web
        run: >-
          pnpm exec playwright test --retries=1 --shard=${{ matrix.shard }}/6
          --project=api --project=crud --project=forms --project=analytics --project=rbac
          --project=journeys --project=robustness --project=accessibility --project=linkages
          --project=screens --project=chromium --project=mock-chromium
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: medbrains/apps/web/blob-report
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-logs-${{ matrix.shard }}
          path: |
            medbrains/server.log
            medbrains/vite.log
          retention-days: 14

  report:
    needs: playwright
    if: ${{ !cancelled() && needs.playwright.result != 'skipped' }}
    name: Playwright results
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The per-test summary: a check run and one PR comment.
      checks: write
      pull-requests: write
    defaults:
      run:
        working-directory: medbrains/apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: medbrains/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: medbrains/.nvmrc
          cache: pnpm
          cache-dependency-path: medbrains/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-blob-*
          path: medbrains/apps/web/all-blob-reports
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --config playwright.merge.config.ts all-blob-reports
      - name: Publish the per-test summary
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        with:
          check_name: Playwright results
          files: medbrains/apps/web/test-results/junit/playwright.xml
          comment_mode: always
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: medbrains/apps/web/playwright-report
          retention-days: 14
