# CI — the gate that actually runs.
#
# There has been a comprehensive `ci.yml` in this repo since June, and it has
# never executed once. GitHub only reads workflows from `.github/workflows/` at
# the *repository root*, and that file lives at `medbrains/.github/workflows/`,
# where nothing looks. Zero runs, ever, while the file sat there looking like a
# safety net.
#
# It could not have passed anyway: it references `dtolnay/rust-action@stable`,
# which does not exist, and sets no `working-directory` — so its Python steps
# (repo root) and its cargo steps (`medbrains/`) cannot both resolve.
#
# This file is deliberately smaller than that one. Every blocking job here has
# been run against master and passes. Everything known to fail is present too,
# as `continue-on-error`, so it is visible and measured rather than quietly
# absent — a red pipeline on day one is a pipeline everyone learns to ignore.
#
# The `continue-on-error` jobs are the backlog. Each should become blocking as
# its debt is paid; none should be deleted to make this file look better.
# Rust clippy and Rust tests were paid off and block since #5978; test-target
# clippy errors are a ratchet that only falls (scripts/check_clippy_tests.py).

name: CI

on:
  # Release and hotfix pushes run this file through ci-release.yml with `no-cache`, so the run
  # that verifies a release branch never restores a dependency cache another run wrote.
  push:
    branches: [master, main]
  workflow_call:
    inputs:
      no-cache:
        description: Restore and save no dependency cache (release and hotfix pushes).
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master, main, 'release/**', 'hotfix/**']
    # No paths-ignore: required checks must report on every PR, or a docs-only PR can never
    # merge. The `changes` job skips the heavy jobs instead (they report as skipped = passing).

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The committed .sqlx metadata. CI has no database, and must not need one.
  SQLX_OFFLINE: true

permissions:
  contents: read

jobs:
  # What changed, so each job runs only when its part of the tree did. A skipped job
  # counts as passing for required checks. Anything unexpected (a new branch, a
  # force-push, a diff that cannot be computed) runs everything.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: "What changed"
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      web: ${{ steps.diff.outputs.web }}
      docker: ${{ steps.diff.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -u
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] \
             || ! files=$(git diff --name-only "$BASE" "$HEAD"); then
            printf 'rust=true\nweb=true\ndocker=true\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf '%s\n' "$files"
          # The gate script is every job's commands, so a change to it runs them all.
          ci='^(\.github/workflows/ci\.yml|medbrains/scripts/gate\.sh)$'
          rust='^medbrains/(crates/|Cargo\.(toml|lock)|\.sqlx/|rust-toolchain|rustfmt|deny\.toml|clippy\.toml|\.cargo/)'
          web='^medbrains/(apps/web/|packages/|package\.json|pnpm-(lock|workspace)\.yaml|turbo\.json|biome\.json|\.nvmrc|tsconfig)'
          docker='^medbrains/(Dockerfile|\.dockerignore|rust-toolchain\.toml|Cargo\.lock)$'
          {
            echo "rust=$(grep -qE "$rust|$ci" <<<"$files" && echo true || echo false)"
            echo "web=$(grep -qE "$web|$ci" <<<"$files" && echo true || echo false)"
            echo "docker=$(grep -qE "$docker|$ci" <<<"$files" && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  # ── Blocking: run against master and verified green ──────────────

  audit-checks:
    # A draft PR spends no build; marking it ready for review runs everything.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Audit checks (RLS, sharing, egress, PCI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The commands live in gate.sh, so `make gate` runs the same ones.
      - run: bash medbrains/scripts/gate.sh audit

  readiness:
    # A draft PR spends no build; marking it ready for review runs everything.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Readiness meters (evidence + generated badges)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Evidence PRs are found in the history, so it must be all there.
          fetch-depth: 0
      - run: bash medbrains/scripts/gate.sh readiness

  docs:
    name: Every new function is documented
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The base is the pull request's (GITHUB_BASE_REF).
      - run: bash medbrains/scripts/gate.sh docs

  docs-prose:
    # Banned words and Title Case headings in the docs site (medbrains/apps/docs/STYLE.md).
    # Report-only until the pages written before the guide are clean; then add --strict.
    name: Docs prose (report-only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node medbrains/apps/docs/scripts/check-prose.mjs

  support-dates:
    # A published end-of-support date may be extended, never cut, and a supported line never
    # vanishes from the table (COMPATIBILITY.md §4, #5499; the CentOS 8 lesson).
    name: Support dates only get longer
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: bash medbrains/scripts/gate.sh support-dates

  contracts:
    # Runs on drafts too, and fails there: the other jobs skip on a draft, and a skipped
    # required check counts as passing, so without this a draft's skipped run could satisfy
    # branch protection. Marking the PR ready for review reruns everything.
    name: API + UI contracts
    runs-on: ubuntu-latest
    steps:
      - name: A draft is not ready to merge
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo "::error::Draft PR: mark it ready for review to run the checks."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The committed-fonts check needs its pinned build tools.
      - name: Font build tools
        run: python3 -m pip install --quiet -r medbrains/tools/fonts/requirements.txt
      # Every contract check, in the order gate.sh lists them.
      - run: bash medbrains/scripts/gate.sh contracts

  # The image is built only when a release is published, so a stale base image
  # surfaced there first (v3.33.0: rust:1.85 against a 1.95 MSRV). This keeps the
  # two in step on every PR, at the cost of one grep.
  docker-toolchain:
    name: Dockerfile matches the toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash medbrains/scripts/gate.sh toolchain

  # Builds the release image without pushing, only when what it depends on changed.
  docker-build:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true'
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: docker buildx build --platform linux/amd64 -f medbrains/Dockerfile medbrains

  rust-fmt:
    # A draft PR spends no build; marking it ready for review runs everything.
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: "Rust format"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medbrains
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the version (and lists rustfmt), so CI formats
      # with the same rustfmt as a local `cargo fmt`; `stable` could disagree.
      - name: Rust toolchain
        run: rustup toolchain install
      - run: bash scripts/gate.sh rust-fmt

  web:
    # A draft PR spends no build; marking it ready for review runs everything.
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: Web typecheck, lint, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The per-test summary check run.
      checks: write
    defaults:
      run:
        working-directory: medbrains
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `with:` inputs are resolved from the repo root — `defaults.run` does not
      # apply to them — so every path here is root-relative even though the
      # steps below run in `medbrains/`. There is an untracked `.nvmrc` at the
      # root that would resolve locally and not exist on a runner.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: medbrains/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: medbrains/.nvmrc
          # Only the explicit `cache:` below, which is empty on a release or hotfix push.
          package-manager-cache: false
          cache: ${{ inputs.no-cache != true && 'pnpm' || '' }}
          cache-dependency-path: medbrains/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Build before typecheck, deliberately. `tsc --noEmit` reads a stale
      # tsconfig.tsbuildinfo and reports clean while real type errors are
      # present — that happened three separate times in one day of work.
      # Building first makes the incremental state honest.
      #
      # Scoped to the web app and its dependencies. A full `turbo run build`
      # takes 35 minutes because it compiles the Tauri desktop shell, which is
      # not worth paying on every PR; the full build is measured separately.
      # MedBrains web and the packages it uses. The outgoing React Native apps
      # are reference only, and desktop, docs and storybook are not this gate.
      # Build, typecheck, test, then the size ceilings (gate.sh says why in that order).
      - run: bash scripts/gate.sh web
      - name: Publish the per-test summary
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        with:
          check_name: Vitest results
          files: medbrains/apps/web/test-results/vitest.xml
          comment_mode: off
      # For the test report e2e.yml builds (tests.medbrains.in).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: vitest-junit
          path: medbrains/apps/web/test-results/vitest.xml
          retention-days: 30

  web-lint:
    # A draft PR spends no build; marking it ready for review runs everything.
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: "Web lint"
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: medbrains
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: medbrains/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: medbrains/.nvmrc
          # Only the explicit `cache:` below, which is empty on a release or hotfix push.
          package-manager-cache: false
          cache: ${{ inputs.no-cache != true && 'pnpm' || '' }}
          cache-dependency-path: medbrains/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint --filter=@medbrains/web...

  rust-clippy:
    # A draft PR spends no build; marking it ready for review runs everything.
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: "Rust clippy"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medbrains
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # No cache on a release or hotfix push (see `no-cache` at the top).
        if: inputs.no-cache != true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            medbrains/target
          # Toolchain first, then the dependency graph. A Cargo.lock change misses the key but
          # restores the newest cache on the same toolchain, and saves a fresh one under the new key.
          key: ${{ runner.os }}-cargo-${{ hashFiles('medbrains/rust-toolchain.toml') }}-${{ hashFiles('medbrains/Cargo.lock', 'medbrains/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-${{ hashFiles('medbrains/rust-toolchain.toml') }}-

      # The whole workspace, then the test-target ratchet.
      - run: bash scripts/gate.sh rust-clippy

  schema-and-tenancy:
    # A draft PR spends no build; marking it ready for review runs everything.
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: "Schema + tenancy"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Every RLS-enabled table must carry a policy (0 gaps as of 2026-10-12;
      # the app runs as medbrains_app, NOBYPASSRLS, migration 0981).
      - name: RLS coverage
        run: |
          python3 scripts/check_rls.py --self-test
          python3 scripts/check_rls.py

      # 4 raw SQL statements in routes/. Exactly the class of query the
      # backstop above is meant to catch.
      - name: No raw SQL in routes
        run: python3 scripts/check_tenant_leak.py

      # Every module name (route checks, menu tags, seed rows, permission groups) comes from
      # crates/medbrains-core/src/bricks.rs. Bricks with no server check may only fall.
      - name: App bricks
        run: python3 scripts/check_bricks.py

      - name: Migration headers
        run: python3 scripts/migration_header_lint.py

      # 12 handlers without #[tracing::instrument]. Matters for an audit trail
      # a regulator will ask to see.
      - name: Tracing spans
        run: python3 scripts/check_tracing_spans.py

  rust-test:
    # A draft PR spends no build; marking it ready for review runs everything.
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: "Rust tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The per-test summary check run.
      checks: write
    defaults:
      run:
        working-directory: medbrains
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # No cache on a release or hotfix push (see `no-cache` at the top).
        if: inputs.no-cache != true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            medbrains/target
          # Toolchain first, then the dependency graph. A Cargo.lock change misses the key but
          # restores the newest cache on the same toolchain, and saves a fresh one under the new key.
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('medbrains/rust-toolchain.toml') }}-${{ hashFiles('medbrains/Cargo.lock', 'medbrains/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-test-${{ hashFiles('medbrains/rust-toolchain.toml') }}-

      # Blocking since #5978. A test that flakes is fixed, or quarantined by name in
      # .config/nextest.toml with its issue; never left to fail here.
      # CUPS headers and PostgreSQL 17 for the integration suite (no Docker, per the OS rule).
      - name: System packages and PostgreSQL
        run: bash scripts/ci_postgres.sh
      # nextest for the JUnit file the PR's per-test summary reads; doc tests separately,
      # since nextest does not run them. Pinned binary + sha256, as sonarqube.yml pins llvm-cov.
      - name: Install cargo-nextest
        env:
          NEXTEST_VERSION: 0.9.150
          # sha256 of cargo-nextest-0.9.150-x86_64-unknown-linux-gnu.tar.gz, from the release.
          NEXTEST_SHA256: b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f
        run: |
          tgz="cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/$tgz"
          echo "$NEXTEST_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$HOME/.cargo/bin" cargo-nextest
          rm "$tgz"
      # nextest (profile in .config/nextest.toml), then the doc tests even if a test failed.
      - run: bash scripts/gate.sh rust-test
        env:
          DATABASE_URL: postgres://medbrains:ci_only@localhost:5432/medbrains
      - name: Publish the per-test summary
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        with:
          check_name: Rust test results
          files: medbrains/target/nextest/ci/junit.xml
          # The check run lists every test; one PR comment (Playwright's) is enough noise.
          comment_mode: off
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: rust-junit
          path: medbrains/target/nextest/ci/junit.xml
          retention-days: 30
