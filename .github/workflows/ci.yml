# CI — the gate that actually runs.
#
# There has been a comprehensive `ci.yml` in this repo since June, and it has
# never executed once. GitHub only reads workflows from `.github/workflows/` at
# the *repository root*, and that file lives at `medbrains/.github/workflows/`,
# where nothing looks. Zero runs, ever, while the file sat there looking like a
# safety net.
#
# It could not have passed anyway: it references `dtolnay/rust-action@stable`,
# which does not exist, and sets no `working-directory` — so its Python steps
# (repo root) and its cargo steps (`medbrains/`) cannot both resolve.
#
# This file is deliberately smaller than that one. Every blocking job here has
# been run against master and passes. Everything known to fail is present too,
# as `continue-on-error`, so it is visible and measured rather than quietly
# absent — a red pipeline on day one is a pipeline everyone learns to ignore.
#
# The `continue-on-error` jobs are the backlog. Each should become blocking as
# its debt is paid; none should be deleted to make this file look better.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
    # Words alone cannot break the product, so they do not spend a build.
    paths-ignore:
      - "**/*.md"
      - "**/*.png"
      - "**/*.excalidraw"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The committed .sqlx metadata. CI has no database, and must not need one.
  SQLX_OFFLINE: true

jobs:
  # ── Blocking: run against master and verified green ──────────────

  audit-checks:
    name: Audit checks (RLS, sharing, egress, PCI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # These four pass today. They stay blocking so they cannot regress
      # while the others are being fixed.
      - run: python3 scripts/check_sharing.py
      - run: python3 scripts/check_audit_coverage.py
      - run: python3 scripts/check_region_pinning.py
      - run: python3 scripts/check_no_card_logging.py
      - run: python3 scripts/check_egress_allowlist.py

  docs:
    name: Every new function is documented
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 medbrains/scripts/check_docs_on_new_functions.py --self-test
      - run: python3 medbrains/scripts/check_docs_on_new_functions.py origin/${{ github.base_ref }}

  contracts:
    name: API + UI contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Frontend calls resolve to real routes
        run: python3 scripts/check_api_contract.py
      - name: Page API references resolve
        run: python3 scripts/check_ui_api_coverage.py
      - name: Decorative effects only ever go down
        run: python3 medbrains/scripts/check_ui_slop.py
      - name: Pages build from the @/components/ui seam
        run: python3 medbrains/scripts/check_ui_seam.py
      - name: No raw interactive HTML in shipped JSX
        run: python3 medbrains/scripts/check_raw_html.py
      # A field marked redactable but never classified falls back to Routine and
      # renders to everyone who can see the record. Nothing at runtime notices.
      - name: Every redactable field declares its data class
        run: python3 medbrains/scripts/check_field_classes.py
      # An authz check whose error becomes `false` answers a fault with the
      # same 404 / empty list it answers a real refusal with.
      - name: No authorization check collapses its error
        run: python3 medbrains/scripts/check_authz_collapse.py
      # Apps reach tenancy, authz, audit, sequences, storage and config only
      # through medbrains-kernel; existing direct access is baselined, never grown.
      - name: Kernel boundary only gets better
        run: |
          python3 medbrains/scripts/check_kernel_boundary.py --self-test
          python3 medbrains/scripts/check_kernel_boundary.py
      # The kernel is technical only (RFC-HOSPITAL-OS §3a): patients, consent and
      # billing live above it, in its dependencies and its words alike.
      - name: Kernel has no domain crates or words
        run: |
          python3 medbrains/scripts/check_kernel_no_domain.py --self-test
          python3 medbrains/scripts/check_kernel_no_domain.py
      # Kernel lines and dependencies, package and crate counts. Reads files only.
      # This job has no web build, so the web job re-runs it for first-load JS.
      - name: Size budgets hold
        run: |
          python3 medbrains/scripts/check_size_budgets.py --self-test
          python3 medbrains/scripts/check_size_budgets.py
      # The TypeScript SDK and its conformance suite run under `pnpm run test`
      # (web job); the Python SDK has no other runner.
      - name: Python SDK speaks the extension protocol
        working-directory: medbrains/sdks/python
        run: python3 -m unittest discover -s tests

  rust-fmt:
    name: "Rust format (TODO: 1053 diffs on master)"
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: medbrains
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Not blocking: `cargo fmt --check` reports 1053 diffs across the tree.
      # Reformatting in bulk would bury real changes in review noise for weeks,
      # so this is measured while files are tidied as they are touched.
      - run: cargo fmt --all -- --check

  web:
    name: Web typecheck, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medbrains
    steps:
      - uses: actions/checkout@v4
      # `with:` inputs are resolved from the repo root — `defaults.run` does not
      # apply to them — so every path here is root-relative even though the
      # steps below run in `medbrains/`. There is an untracked `.nvmrc` at the
      # root that would resolve locally and not exist on a runner.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: medbrains/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: medbrains/.nvmrc
          cache: pnpm
          cache-dependency-path: medbrains/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Build before typecheck, deliberately. `tsc --noEmit` reads a stale
      # tsconfig.tsbuildinfo and reports clean while real type errors are
      # present — that happened three separate times in one day of work.
      # Building first makes the incremental state honest.
      #
      # Scoped to the web app and its dependencies. A full `turbo run build`
      # takes 35 minutes because it compiles the Tauri desktop shell, which is
      # not worth paying on every PR; the full build is measured separately.
      # MedBrains web and the packages it uses. The outgoing React Native apps
      # are reference only, and desktop, docs and storybook are not this gate.
      - run: pnpm turbo run build typecheck test --filter=@medbrains/web...
      - name: Web first-load JS stays under its ceiling
        run: python3 scripts/check_size_budgets.py

  web-lint:
    name: "Web lint"
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: medbrains
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: medbrains/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: medbrains/.nvmrc
          cache: pnpm
          cache-dependency-path: medbrains/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint --filter=@medbrains/web...

  rust-clippy:
    name: "Rust clippy"
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: medbrains
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            medbrains/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('medbrains/**/Cargo.toml') }}

      # Library code is clean and is the bar worth holding first.
      # Every crate except the desktop GUI tree, which needs GTK on the runner.
      # Denied lints fail on their own; pedantic and nursery are warnings by
      # project policy (ENGINEERING.md), so -D warnings would overrule it.
      - run: cargo clippy --workspace --exclude medbrains-desktop

  schema-and-tenancy:
    name: "Schema + tenancy"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every RLS-enabled table must carry a policy (0 gaps as of 2026-10-12;
      # the app runs as medbrains_app, NOBYPASSRLS, migration 0981).
      - name: RLS coverage
        run: |
          python3 scripts/check_rls.py --self-test
          python3 scripts/check_rls.py

      # 4 raw SQL statements in routes/. Exactly the class of query the
      # backstop above is meant to catch.
      - name: No raw SQL in routes
        run: python3 scripts/check_tenant_leak.py

      # Every module name (route checks, menu tags, seed rows, permission groups) comes from
      # crates/medbrains-core/src/bricks.rs. Bricks with no server check may only fall.
      - name: App bricks
        run: python3 scripts/check_bricks.py

      - name: Migration headers
        run: python3 scripts/migration_header_lint.py

      # 12 handlers without #[tracing::instrument]. Matters for an audit trail
      # a regulator will ask to see.
      - name: Tracing spans
        run: python3 scripts/check_tracing_spans.py

  rust-test:
    name: "Rust tests"
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: medbrains
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            medbrains/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('medbrains/**/Cargo.toml') }}

      # Non-blocking until it has been seen to pass on a runner.
      # medbrains-printing links against CUPS.
      # The integration suite needs PostgreSQL. It runs directly on the runner, because
      # the OS rule is no Docker. These credentials exist only on this throwaway machine.
      - name: System packages and PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y libcups2-dev postgresql-common
          # The migrations need 17 (`transaction_timeout`), and the runner's default is older.
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo systemctl stop postgresql
          for cluster in $(pg_lsclusters -h | awk '{print $1"/"$2}'); do
            sudo pg_dropcluster --stop "${cluster%/*}" "${cluster#*/}"
          done
          sudo apt-get install -y postgresql-17
          pg_lsclusters -h | grep -q '^17 ' || sudo pg_createcluster 17 main
          sudo pg_ctlcluster 17 main start
          pg_lsclusters
          sudo -u postgres psql -c "CREATE ROLE medbrains SUPERUSER LOGIN PASSWORD 'ci_only'"
          sudo -u postgres createdb -O medbrains medbrains
      # Report every failing test, not just the first binary's.
      - run: cargo test --workspace --exclude medbrains-desktop --no-fail-fast
        env:
          DATABASE_URL: postgres://medbrains:ci_only@localhost:5432/medbrains
