# SonarQube Cloud: code quality, coverage gaps and security hotspots across the
# languages we ship (Rust, TypeScript, Swift, Kotlin, Python, Terraform).
# Results show on each PR and at sonarcloud.io. It complements CodeQL and the
# scanners in security.yml; it does not replace them.
#
# Runs only once the owner has set it up: create the project on SonarQube Cloud
# (free for public repos), then add the SONAR_TOKEN repository secret. Until then
# the job reports that it was skipped and passes. Settings: sonar-project.properties.

name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonarqube:
    # A draft PR spends no build; marking it ready for review runs everything.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: SonarQube analysis
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Skip until SonarQube Cloud is set up
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN is not set; SonarQube analysis skipped."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.SONAR_TOKEN != ''
        with:
          persist-credentials: false
          # Full history, so new-code detection and blame work.
          fetch-depth: 0
      - name: Read the release version
        id: version
        if: env.SONAR_TOKEN != ''
        run: echo "version=$(grep -m1 -E '^version *=' medbrains/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        if: env.SONAR_TOKEN != ''
        with:
          args: -Dsonar.projectVersion=${{ steps.version.outputs.version }}
