name: SpiceDB Schema Validate

# Runs `zed validate` against infra/spicedb/schema.zed on every PR
# that touches the schema. Stops a malformed schema from landing on
# master before the operator's schema-write Job has a chance to
# reject it on the cluster.

on:
  push:
    branches: [main, master, develop]
    paths:
      - "medbrains/infra/spicedb/schema.zed"
      - ".github/workflows/spicedb-validate.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master, develop]
    paths:
      - "medbrains/infra/spicedb/schema.zed"
      - ".github/workflows/spicedb-validate.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zed-validate:
    # A draft PR spends no build; marking it ready for review runs everything.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: zed validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # zed is the SpiceDB CLI and versions separately from the server
      # (modules/spicedb/main.tf::spicedb_image_version). The old pin,
      # 0.27.2, was never a zed release, so this job had never passed.
      - name: Install zed
        env:
          ZED_VERSION: "1.2.1"
        run: |
          set -euo pipefail
          f="zed_${ZED_VERSION}_linux_amd64_gnu.tar.gz"
          base="https://github.com/authzed/zed/releases/download/v${ZED_VERSION}"
          curl -fsSLO "$base/$f" -fsSLO "$base/checksums.txt"
          grep " $f\$" checksums.txt | sha256sum -c -
          tar -xzf "$f" -C /usr/local/bin zed
          zed version

      - name: Validate schema
        run: |
          set -euo pipefail
          cd medbrains/infra/spicedb
          # A .zed file is parsed and type-checked locally; no live cluster.
          zed validate schema.zed

  # On merge to master, write the schema to the dev cluster so the
  # next deploy doesn't drift. Gated on the dev cluster being applied
  # (Phase 5 of the hybrid roadmap). The job is allowed to fail
  # softly for now — once Phase 5 lands, drop `continue-on-error`.
  dev-cluster-sync:
    name: Apply schema to dev cluster
    needs: zed-validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install zed
        env:
          ZED_VERSION: "1.2.1"
        run: |
          set -euo pipefail
          f="zed_${ZED_VERSION}_linux_amd64_gnu.tar.gz"
          base="https://github.com/authzed/zed/releases/download/v${ZED_VERSION}"
          curl -fsSLO "$base/$f" -fsSLO "$base/checksums.txt"
          grep " $f\$" checksums.txt | sha256sum -c -
          tar -xzf "$f" -C /usr/local/bin zed

      - name: Configure zed context
        env:
          DEV_SPICEDB_ENDPOINT: ${{ secrets.DEV_SPICEDB_ENDPOINT }}
          DEV_SPICEDB_TOKEN: ${{ secrets.DEV_SPICEDB_TOKEN }}
        run: |
          if [ -z "${DEV_SPICEDB_ENDPOINT:-}" ] || [ -z "${DEV_SPICEDB_TOKEN:-}" ]; then
            echo "::warning::DEV_SPICEDB_* secrets not set — skipping schema-write. Configure once Phase 5 cluster is applied."
            exit 0
          fi
          zed context set dev "$DEV_SPICEDB_ENDPOINT" "$DEV_SPICEDB_TOKEN"

      - name: Write schema
        env:
          DEV_SPICEDB_ENDPOINT: ${{ secrets.DEV_SPICEDB_ENDPOINT }}
        run: |
          if [ -z "${DEV_SPICEDB_ENDPOINT:-}" ]; then
            echo "Skipping — no dev endpoint configured."
            exit 0
          fi
          zed schema write medbrains/infra/spicedb/schema.zed
