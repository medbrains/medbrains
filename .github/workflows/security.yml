# Security scanning. Moved from medbrains/.github/workflows/, where GitHub never
# read it (only the repo-root .github/ is live), so none of this had ever run.
#
# Paths: the repo root is MedBrains/; the code lives in medbrains/. `defaults.run`
# does not apply to `with:` inputs, so those stay root-relative.
#
# Non-blocking jobs carry their reason. Flip them as the reason is fixed — the
# same convention as ci.yml.

name: Security

on:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master, main]
  schedule:
    # Daily: new advisories land against unchanged code, and a week is too long for a hospital.
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Dependency audits matter when dependencies change; new advisories against unchanged
  # code are caught by the nightly run. The secrets scan always runs.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: "What changed"
    runs-on: ubuntu-latest
    outputs:
      cargo: ${{ steps.diff.outputs.cargo }}
      js: ${{ steps.diff.outputs.js }}
      website: ${{ steps.diff.outputs.website }}
      code: ${{ steps.diff.outputs.code }}
      infra: ${{ steps.diff.outputs.infra }}
      workflows: ${{ steps.diff.outputs.workflows }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -u
          all() { for k in cargo js website code infra workflows; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; }
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] \
             || [ "$BASE" = 0000000000000000000000000000000000000000 ] \
             || ! files=$(git diff --name-only "$BASE" "$HEAD"); then all; exit 0; fi
          sec='^\.github/workflows/security\.yml$'
          has() { grep -qE "$1|$sec" <<<"$files" && echo true || echo false; }
          {
            echo "cargo=$(has '(^|/)(Cargo\.(toml|lock)|deny\.toml)$')"
            echo "js=$(has '(^|/)(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$')"
            echo "website=$(has '^website/')"
            echo "code=$(has '\.(rs|ts|tsx|js|py|kt|swift)$')"
            echo "infra=$(has '^medbrains/(infra|deploy|os)/|Dockerfile|\.tf$')"
            echo "workflows=$(has '^\.github/')"
          } >> "$GITHUB_OUTPUT"

  cargo-audit:
    # A draft PR spends no build; marking it ready for review runs everything.
    needs: changes
    if: needs.changes.outputs.cargo == 'true'
    name: Cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medbrains
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo install cargo-audit --locked
      # Audits the committed Cargo.lock — what production actually builds. Reads
      # only the lockfile.
      # Ignores come from deny.toml so there is one list, each with a reason
      # and an expiry that check_audit_ignores.py enforces.
      - run: python3 scripts/check_audit_ignores.py
      - run: cargo audit $(python3 scripts/check_audit_ignores.py --cargo-audit-args)

  cargo-deny:
    # A draft PR spends no build; marking it ready for review runs everything.
    needs: changes
    if: needs.changes.outputs.cargo == 'true'
    name: Cargo deny (advisories, licences, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: medbrains/Cargo.toml
          log-level: warn
          command: check
          arguments: --all-features

  pnpm-audit:
    # A draft PR spends no build; marking it ready for review runs everything.
    needs: changes
    if: needs.changes.outputs.js == 'true'
    name: "pnpm audit (production, high+)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medbrains
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: medbrains/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: medbrains/.nvmrc
      # Reads only the committed lockfile, so no install is needed.
      # Production dependencies only: dev tooling never reaches a patient.
      # Ignores live in pnpm-workspace.yaml with a reason and an expiry each.
      - run: python3 scripts/check_audit_ignores.py
      - run: pnpm audit --prod --audit-level=high

  website-audit:
    # A draft PR spends no build; marking it ready for review runs everything.
    needs: changes
    if: needs.changes.outputs.website == 'true'
    name: "pnpm audit, website (production, high+)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The website's package.json names no pnpm version, so this one is pinned here to match
      # medbrains/package.json. Without a version the setup step fails and no audit runs.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.30.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: medbrains/.nvmrc
      - run: pnpm audit --prod --audit-level=high

  secrets-scan:
    # A draft PR spends no build; marking it ready for review runs everything.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Secrets scan (TruffleHog, verified only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Base/head are derived from the event by the action. Passing
      # base=default branch on a push to master made base == head and failed.
      # Pinned: a scanner on a moving branch runs whatever that branch holds today. v3.99.8.
      - uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb
        with:
          extra_args: --only-verified

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  codeql:
    # A draft PR spends no build; marking it ready for review runs everything.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          # JS/TS needs no build; autobuild would try the whole monorepo.
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  # Report-only to start: each one uploads to Security > Code scanning so findings
  # get triaged there, then flips to blocking once its backlog is zero. Tool
  # versions are pinned and at least two weeks old; binaries are checksum-verified.

  osv-scanner:
    # CVEs in every lockfile cargo-audit and pnpm audit cannot see: uv.lock,
    # the native apps (Gradle, SwiftPM), Python requirements, the OS image.
    needs: changes
    if: needs.changes.outputs.cargo == 'true' || needs.changes.outputs.js == 'true'
    name: "OSV scan, every lockfile (report-only)"
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    env:
      OSV_VERSION: v2.7.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install osv-scanner (checksum-verified)
        run: |
          base=https://github.com/google/osv-scanner/releases/download/$OSV_VERSION
          curl -fsSLO "$base/osv-scanner_linux_amd64" -fsSLO "$base/osv-scanner_SHA256SUMS"
          grep ' osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum -c -
          install -m 755 osv-scanner_linux_amd64 /usr/local/bin/osv-scanner
      - name: Scan
        # Vendored crates are patched copies; their upstream advisories are tracked
        # in the vendor README, not here. Their own Cargo.lock files are never read by
        # our build (the workspace Cargo.lock resolves them). A bare `vendor` name did
        # not stop the scan reaching medbrains/vendor/pingora-core-0.9.1/Cargo.lock, so
        # match any path segment by regex.
        run: osv-scanner scan source -r . --x-exclude='r:(^|/)vendor(/|$)' --x-exclude=node_modules --format sarif --output osv.sarif || true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  iac-compliance:
    # Terraform and Dockerfiles against CIS benchmarks: open buckets, unencrypted
    # volumes, public databases, missing logging.
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    name: "IaC compliance, Checkov (report-only)"
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install checkov==3.3.30
      - name: Scan
        run: checkov -d medbrains/infra --framework terraform dockerfile --skip-path medbrains/vendor -o sarif --output-file-path . --soft-fail
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results_sarif.sarif
          category: checkov

  workflow-audit:
    # The workflows themselves: script injection from PR titles, over-broad tokens,
    # unpinned third-party actions, credentials left in checkouts.
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    name: "Workflow audit, zizmor (report-only)"
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install zizmor==1.31.1
      - run: zizmor --offline --format sarif .github/workflows > zizmor.sarif || true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  sbom:
    # The bill of materials a hospital's security team (and CERT-In) asks for,
    # kept 90 days per commit on main and nightly. Not run on PRs.
    if: github.event_name != 'pull_request'
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    env:
      SYFT_VERSION: 1.55.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install syft (checksum-verified)
        run: |
          base=https://github.com/anchore/syft/releases/download/v$SYFT_VERSION
          tgz=syft_${SYFT_VERSION}_linux_amd64.tar.gz
          curl -fsSLO "$base/$tgz" -fsSLO "$base/syft_${SYFT_VERSION}_checksums.txt"
          grep " $tgz\$" syft_${SYFT_VERSION}_checksums.txt | sha256sum -c -
          tar -xzf "$tgz" syft && install -m 755 syft /usr/local/bin/syft
      - run: syft dir:. --exclude ./medbrains/vendor --exclude '**/node_modules' -o cyclonedx-json=sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90
