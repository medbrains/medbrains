# Release artefacts on a version tag. Moved from medbrains/.github/workflows/
# (never read there).
#
# A v* tag builds everything and drafts the GitHub release; a manual run is a
# dry run that publishes nothing. The Docker image is pushed to GHCR only when
# the owner presses Publish on that draft (the `release: published` event), so
# nothing public exists before the owner says go (docs/DECISIONS.md). Production is built with cargo-zigbuild on the operator's
# machine (ENGINEERING.md) — this workflow is a GitHub release, not the deploy.
#
# Supply chain (RFC-HOSPITAL-OS §8j, SEC1): the image is signed with cosign
# keyless (GitHub OIDC, no key to lose), every artefact gets a build-provenance
# attestation, and the release carries CycloneDX SBOMs and SHA-256 checksums,
# the checksum file itself signed. Verify with the commands in
# medbrains/docs/SECURITY-RELEASE-PROCESS.md. The SDKs are never published
# from here: see publish-sdks.yml.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build-backend:
    # Every binary a hospital runs, for both server architectures, with
    # cargo-zigbuild (ENGINEERING.md: the only cross-compile path) against
    # glibc 2.36 so they run on Debian 12 and later. Dev-only tools (loadtest,
    # ai-eval, os-test, probes, codegen) are not shipped.
    name: Build binaries (${{ matrix.arch }})
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86-64, triple: x86_64-unknown-linux-gnu }
          - { arch: arm64, triple: aarch64-unknown-linux-gnu }
    defaults:
      run:
        working-directory: medbrains
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A tag that names another version than the workspace stops the whole release here:
      # the release, the OS image and every app depend on this job.
      - name: The tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        run: bash medbrains/scripts/app_version.sh "$GITHUB_REF_NAME"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.triple }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
          # No cache in a release: a poisoned cache would ship in signed artefacts.
          use-cache: false
      - run: cargo install cargo-zigbuild --locked --version 0.24.0
      - run: >-
          cargo zigbuild --locked --release --target=${{ matrix.triple }}.2.36
          -p medbrains-server --bin medbrains-server --bin medbrains-archive
          -p medbrains-os-setup --bin medbrains-os-setup
          -p medbrains-agent --bin medbrains-agent
          -p medbrains-proxy --bin medbrains-front
          -p medbrains-bridge --bin medbrains-bridge
          -p medbrains-edge-app --bin medbrains-edge
          -p medbrains-os-update --bin medbrains-os-update
      - name: Collect
        run: |
          mkdir -p ../bins
          for b in medbrains-server medbrains-archive medbrains-os-setup medbrains-agent medbrains-front medbrains-bridge medbrains-edge medbrains-os-update; do
            cp "target/${{ matrix.triple }}/release/$b" ../bins/
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bins-${{ matrix.arch }}
          path: bins
          retention-days: 30

  build-frontend:
    name: Build frontend
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medbrains
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: medbrains/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: medbrains/.nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@medbrains/web...
        env:
          NODE_ENV: production
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: medbrains/apps/web/dist
          retention-days: 30

  android:
    # Every native app module (apps/android/app-*: staff and patient today), as an APK to
    # sideload and an AAB for Play. Release-signed only when the keystore secrets are set;
    # without them both are marked -unsigned (the APK will not install).
    name: Android apps
    if: github.event_name != 'release'
    # Signing keys live in the `release` environment, which only `v*` tags may use; a manual
    # trial run joins no environment and builds unsigned.
    environment: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medbrains/apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      # Its default list asks for 'tools', which the SDK no longer has, and sdkmanager then fails.
      # AGP downloads compileSdk and build-tools itself, under the licences this accepts.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools ndk;27.1.12297006
      # The Rust core (crates/medbrains-edge-rn) is generated, never committed
      # (apps/android/.gitignore): the Android half of `make native-core`, UniFFI Kotlin
      # into core/src/main/kotlin and one .so per ABI into core/src/main/jniLibs.
      - name: Build the Rust core and its Kotlin bindings
        working-directory: medbrains
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked --version 4.1.2
          # Unstripped host build: UniFFI reads its metadata from the library's symbols, and the
          # release profile strips them (strip = true), which leaves "No UniFFI metadata found".
          CARGO_PROFILE_RELEASE_STRIP=false cargo build --locked -p medbrains-edge-rn --release
          cargo run --locked -q -p medbrains-edge-rn --bin uniffi-bindgen -- generate \
            --library target/release/libmedbrains_edge_rn.so --language kotlin \
            --out-dir apps/android/core/src/main/kotlin
          cargo ndk -t arm64-v8a -t x86_64 -o apps/android/core/src/main/jniLibs \
            build --release -p medbrains-edge-rn
      # A new apps/android/app-<name> module is picked up without editing this job.
      # versionName and versionCode come from the workspace version (build.gradle.kts); a tag
      # naming another version fails here rather than shipping apps that disagree with it.
      # The patient app's release build needs the hospital server it talks to; a public release
      # names one only when the PATIENT_SERVER_URL repository variable is set, otherwise the
      # patient app is left out of the release (a hospital builds it with its own address).
      # With the SENTRY_AUTH_TOKEN secret set, each app gets its own ProGuard UUID (compiled into
      # BuildConfig, so a crash report names its mapping) and the next step uploads the R8
      # mapping. Only whether the token is set reaches this step, never the token.
      - env:
          PATIENT_SERVER_URL: ${{ vars.PATIENT_SERVER_URL }}
          HAS_SENTRY_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
        run: |
          [[ "$GITHUB_REF" != refs/tags/v* ]] || ../../scripts/app_version.sh "$GITHUB_REF_NAME"
          tasks=()
          uuids=()
          : > "$RUNNER_TEMP/proguard-uuids"
          for d in app-*; do
            if [[ "$d" == app-patient && -z "$PATIENT_SERVER_URL" ]]; then
              echo "::notice::app-patient left out: set the PATIENT_SERVER_URL repository variable to build it"
              continue
            fi
            tasks+=(":$d:assembleRelease" ":$d:bundleRelease")
            if [[ "$HAS_SENTRY_TOKEN" == true ]]; then
              uuid=$(cat /proc/sys/kernel/random/uuid)
              uuids+=("-Psentry.proguardUuid.$d=$uuid")
              echo "$d $uuid" >> "$RUNNER_TEMP/proguard-uuids"
            fi
          done
          ./gradlew --no-daemon ${PATIENT_SERVER_URL:+"-Pmedbrains.serverUrl=$PATIENT_SERVER_URL"} "${uuids[@]}" "${tasks[@]}"
      # sentry-cli is a pinned release binary checked against its published sha256.
      - name: Upload R8 mappings to error tracking
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_ANDROID_PROJECT }}
          SENTRY_CLI_VERSION: 3.8.2
          SENTRY_CLI_SHA256: c958865f9d4000183509ea21b1f04925d5390de6d8d87386b9e69f2b305070c3
        run: |
          if [[ -z "$SENTRY_AUTH_TOKEN" ]]; then
            echo "::notice::R8 mappings not uploaded: the SENTRY_AUTH_TOKEN secret is not set"
            exit 0
          fi
          cli="$RUNNER_TEMP/sentry-cli"
          curl -fsSL -o "$cli" "https://github.com/getsentry/sentry-cli/releases/download/$SENTRY_CLI_VERSION/sentry-cli-Linux-x86_64"
          echo "$SENTRY_CLI_SHA256  $cli" | sha256sum -c -
          chmod +x "$cli"
          while read -r d uuid; do
            "$cli" proguard upload --uuid "$uuid" --require-one "$d/build/outputs/mapping/release/mapping.txt"
          done < "$RUNNER_TEMP/proguard-uuids"
      - name: Sign, or mark unsigned
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          out="$GITHUB_WORKSPACE/apk"; mkdir -p "$out"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          [ -n "$KEYSTORE_B64" ] && echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          for d in app-*/; do
            app=${d#app-}; app=${app%/}
            # A module left out of this build (app-patient without a server address) has no output.
            [ -d "${d}build/outputs/apk/release" ] || continue
            apk=$(find "${d}build/outputs/apk/release" -name '*.apk' | head -1)
            aab=$(find "${d}build/outputs/bundle/release" -name '*.aab' | head -1)
            if [ -n "$KEYSTORE_B64" ]; then
              "$bt/zipalign" -P 16 -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
              "$bt/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
                --ks-key-alias "$KEY_ALIAS" --out "$out/medbrains-$app-android.apk" "$RUNNER_TEMP/aligned.apk"
              # An AAB is signed with jarsigner (apksigner does not take bundles).
              jarsigner -keystore "$RUNNER_TEMP/release.jks" -storepass:env KEYSTORE_PASSWORD \
                -signedjar "$out/medbrains-$app-android.aab" "$aab" "$KEY_ALIAS"
            else
              cp "$apk" "$out/medbrains-$app-android-unsigned.apk"
              cp "$aab" "$out/medbrains-$app-android-unsigned.aab"
            fi
          done
          rm -f "$RUNNER_TEMP/release.jks" "$out"/*.idsig
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: apk
          retention-days: 30

  ios:
    # Every iOS app (apps/ios: MedBrainsStaff, MedBrainsPatient), archived for release on a
    # macOS runner. Signed into an App Store .ipa only when all the Apple distribution secrets
    # are set (docs/developer/reference/ci-cd.md lists them); otherwise an unsigned .xcarchive
    # marked -unsigned, which proves the release build but installs nowhere. Never uploaded
    # to App Store Connect from here.
    name: iOS apps
    if: github.event_name != 'release'
    # Signing keys live in the `release` environment, which only `v*` tags may use; a manual
    # trial run joins no environment and builds unsigned.
    environment: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        working-directory: medbrains
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Rust core is generated, never committed (apps/ios/.gitignore): the iOS half of
      # `make native-core`, UniFFI Swift into MedBrainsCore/Generated and the xcframework.
      - name: Build the Rust core and its Swift bindings
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          # Unstripped host build: UniFFI reads its metadata from the library's symbols.
          CARGO_PROFILE_RELEASE_STRIP=false cargo build --locked -p medbrains-edge-rn --release
          cargo build --locked -p medbrains-edge-rn --release --target aarch64-apple-ios
          cargo build --locked -p medbrains-edge-rn --release --target aarch64-apple-ios-sim
          core=apps/ios/Packages/MedBrainsCore hdr="$RUNNER_TEMP/edge-rn-headers"
          mkdir -p "$core/Generated" "$hdr"
          cargo run --locked -q -p medbrains-edge-rn --bin uniffi-bindgen -- generate \
            --library target/release/libmedbrains_edge_rn.dylib --language swift --out-dir "$core/Generated"
          cp "$core/Generated/edge_rnFFI.h" "$hdr/"
          cp "$core/Generated/edge_rnFFI.modulemap" "$hdr/module.modulemap"
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios-sim/release/libmedbrains_edge_rn.a -headers "$hdr" \
            -library target/aarch64-apple-ios/release/libmedbrains_edge_rn.a -headers "$hdr" \
            -output "$core/MedBrainsEdgeRn.xcframework"
      - name: Generate the Xcode project
        working-directory: medbrains/apps/ios
        run: brew install xcodegen && xcodegen generate
      # A temporary keychain with the distribution certificate, and each app's App Store
      # provisioning profile installed. Signs only when every secret is present.
      - name: Signing material, only when set
        id: sign
        env:
          P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROFILE_STAFF: ${{ secrets.APPLE_PROFILE_STAFF }}
          APPLE_PROFILE_PATIENT: ${{ secrets.APPLE_PROFILE_PATIENT }}
        run: |
          if [ -z "$P12" ] || [ -z "$TEAM_ID" ] || [ -z "$APPLE_PROFILE_STAFF" ] || [ -z "$APPLE_PROFILE_PATIENT" ]; then
            echo "::warning::Apple distribution secrets are not all set: building unsigned .xcarchive files"
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          kc="$RUNNER_TEMP/sign.keychain-db" kcpw=$(openssl rand -hex 16)
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" "$HOME/Library/Keychains/login.keychain-db"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
          done
          for app in STAFF PATIENT; do
            v="APPLE_PROFILE_$app"; f="$RUNNER_TEMP/$app.mobileprovision"
            echo "${!v}" | base64 -d > "$f"
            uuid=$(security cms -D -i "$f" | plutil -extract UUID raw -)
            cp "$f" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
            cp "$f" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision"
            echo "profile_$(echo "$app" | tr '[:upper:]' '[:lower:]')=$uuid" >> "$GITHUB_OUTPUT"
          done
          { echo "signed=true"; echo "keychain=$kc"; } >> "$GITHUB_OUTPUT"
      - name: Archive, and export when signed
        working-directory: medbrains/apps/ios
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
          KEYCHAIN: ${{ steps.sign.outputs.keychain }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_STAFF: ${{ steps.sign.outputs.profile_staff }}
          PROFILE_PATIENT: ${{ steps.sign.outputs.profile_patient }}
        run: |
          out="$GITHUB_WORKSPACE/ios"; mkdir -p "$out"
          # One version for every app (scripts/app_version.sh); a tag naming another version fails.
          tag=; [[ "$GITHUB_REF" == refs/tags/v* ]] && tag=$GITHUB_REF_NAME
          read -r version build <<< "$(../../scripts/app_version.sh ${tag:+"$tag"})"
          for pair in staff:Staff patient:Patient; do
            app=${pair%%:*} scheme=MedBrains${pair#*:}
            archive="$RUNNER_TEMP/$scheme.xcarchive"
            base=(-project MedBrains.xcodeproj -scheme "$scheme" -configuration Release
                  -destination generic/platform=iOS -archivePath "$archive"
                  MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$build")
            if [ "$SIGNED" != true ]; then
              xcodebuild archive "${base[@]}" CODE_SIGNING_ALLOWED=NO
              ditto -c -k --keepParent "$archive" "$out/medbrains-$app-ios-unsigned.xcarchive.zip"
              continue
            fi
            pv="PROFILE_$(echo "$app" | tr '[:lower:]' '[:upper:]')"; profile=${!pv}
            # MB_APP_PROFILE reaches only the app target (project.yml); a profile set
            # globally would also land on the Swift packages, which refuse one.
            xcodebuild archive "${base[@]}" CODE_SIGN_IDENTITY="Apple Distribution" \
              DEVELOPMENT_TEAM="$TEAM_ID" MB_APP_PROFILE="$profile" OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN"
            bundle=$(plutil -extract ApplicationProperties.CFBundleIdentifier raw "$archive/Info.plist")
            cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$bundle</key><string>$profile</string></dict>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST
            xcodebuild -exportArchive -archivePath "$archive" -exportPath "$RUNNER_TEMP/export-$app" \
              -exportOptionsPlist "$RUNNER_TEMP/export.plist"
            cp "$RUNNER_TEMP/export-$app"/*.ipa "$out/medbrains-$app-ios.ipa"
          done
      - name: Remove the keychain
        if: always() && steps.sign.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.sign.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios
          path: ios
          retention-days: 30

  build-kanidm:
    # The identity provider the image carries, cross-compiled per arch by os/build-kanidm.sh
    # (pinned source, lock and vendored crates; no Docker).
    name: Build Kanidm (${{ matrix.arch }})
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86-64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
          # No cache in a release: a poisoned cache would ship in signed artefacts.
          use-cache: false
      # The pinned 1.99.1 and both Linux targets, from medbrains/rust-toolchain.toml.
      - run: rustup toolchain install
        working-directory: medbrains
      - run: cargo install cargo-zigbuild --locked --version 0.24.0
      - run: OS_WORK="$RUNNER_TEMP/os" medbrains/os/build-kanidm.sh --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kanidm-${{ matrix.arch }}
          path: ${{ runner.temp }}/os/kanidm-${{ matrix.arch }}
          retention-days: 30

  os-image:
    # The appliance disk image (os/README.md), built by mkosi in a Debian
    # container on a native runner per architecture. PCR-signed only with the
    # owner's key; never a DEBUG image. From the same .raw: the installer .iso,
    # and the VM and cloud disks (os/formats.sh). os/release-files.md says which is which.
    name: OS image (${{ matrix.arch }})
    needs: [build-backend, build-frontend, build-kanidm]
    # Signing keys live in the `release` environment, which only `v*` tags may use; a manual
    # trial run joins no environment and builds unsigned.
    environment: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:trixie
      # A volume for /var/tmp, mkosi's workspace: its build overlay cannot sit on Docker's own
      # overlay (the same mount os/build.sh gives its Mac builder).
      options: --privileged -v /var/tmp
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86-64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Build packages
        run: |
          apt-get update -q
          apt-get install -yq --no-install-recommends git mkosi systemd-ukify systemd-repart systemd-boot-efi \
            systemd-container apt dpkg debian-archive-keyring dosfstools mtools e2fsprogs erofs-utils cpio \
            kmod zstd xz-utils ca-certificates python3 bubblewrap uidmap openssl xorriso qemu-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bins-${{ matrix.arch }}
          path: bins
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web-dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kanidm-${{ matrix.arch }}
          path: kanidm
      - name: Build the image
        env:
          PCR_KEY: ${{ secrets.OS_PCR_KEY }}
          PCR_CERT: ${{ secrets.OS_PCR_CERT }}
          SB_KEY: ${{ secrets.OS_SB_KEY }}
          SB_CERT: ${{ secrets.OS_SB_CERT }}
        run: |
          # The OS version must be plain dotted numbers (os/build.sh): a v3.33.0 tag gives 3.33.0.
          # A trial run's ref is a branch, so build.sh numbers it from the commit time, and the
          # file name carries the branch (a slash cannot go in a file name).
          version=$(printf '%s' "$GITHUB_REF_NAME" | tr / -)
          case "$GITHUB_REF" in
            refs/tags/v*) export OS_VERSION="${GITHUB_REF_NAME#v}" ;;
          esac
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chmod +x bins/* kanidm/kanidmd
          suffix=-unsigned
          trap 'rm -f "$RUNNER_TEMP/pcr.key" "$RUNNER_TEMP/pcr.crt" "$RUNNER_TEMP/sb.key" "$RUNNER_TEMP/sb.crt"' EXIT
          # Key files are readable by their owner only; mkosi refuses a group- or world-readable key.
          umask 077
          if [ -n "$PCR_KEY" ]; then
            printf '%s' "$PCR_KEY" > "$RUNNER_TEMP/pcr.key"; printf '%s' "$PCR_CERT" > "$RUNNER_TEMP/pcr.crt"
            export OS_PCR_KEY="$RUNNER_TEMP/pcr.key" OS_PCR_CERT="$RUNNER_TEMP/pcr.crt"; suffix=
          fi
          # Secure Boot signing, for the image and the installer alike, only with the owner's key.
          if [ -n "$SB_KEY" ]; then
            printf '%s' "$SB_KEY" > "$RUNNER_TEMP/sb.key"; printf '%s' "$SB_CERT" > "$RUNNER_TEMP/sb.crt"
            export OS_SB_KEY="$RUNNER_TEMP/sb.key" OS_SB_CERT="$RUNNER_TEMP/sb.crt"
          fi
          MEDBRAINS_SERVER_BIN="$PWD/bins/medbrains-server" MEDBRAINS_WEB_DIST="$PWD/web-dist" \
            KANIDM_DIR="$PWD/kanidm" OS_WORK="$RUNNER_TEMP/os" medbrains/os/build.sh --arch ${{ matrix.arch }}
          rm -f "$RUNNER_TEMP/pcr.key"
          mkdir -p img
          raw=$(ls "$RUNNER_TEMP"/os/out-${{ matrix.arch }}/*.raw | head -1)
          name="medbrains-os-$version-${{ matrix.arch }}$suffix"
          zstd -T0 -19 "$raw" -o "img/$name.raw.zst"
          # The installer carries that same .raw.zst, so it writes exactly the image above.
          OS_WORK="$RUNNER_TEMP/os" medbrains/os/build-iso.sh --arch ${{ matrix.arch }} --image "img/$name.raw.zst" --out "img/$name.iso"
          rm -f "$RUNNER_TEMP/sb.key"
          medbrains/os/formats.sh "$raw" "$name" ${{ matrix.arch }} img
          # The image, its padded Azure copy and every format pass through this disk at once.
          df -h "$PWD" "$RUNNER_TEMP"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: os-${{ matrix.arch }}
          path: img
          retention-days: 30

  docker:
    name: Build & push image
    # Pushing to GHCR is public, so only the owner pressing Publish on a v*
    # release does it. Never on a tag push or a manual run: a manual run has no
    # version tag and would push an image named only by its commit.
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write       # the image SBOM goes onto the published release
      packages: write
      id-token: write       # keyless signing + provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: medbrains
          file: medbrains/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image (keyless)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # The image is distroless, so this lists its few OS packages; the
      # crates and npm packages are in the source SBOM the release job makes.
      # The release's SHA256SUMS was signed at tag time, before this image
      # existed, so the SBOM carries its own signature bundle.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: medbrains-image.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Sign the image SBOM and add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cosign sign-blob --yes --bundle medbrains-image.cdx.json.sigstore.json medbrains-image.cdx.json
          gh release upload "$TAG" medbrains-image.cdx.json medbrains-image.cdx.json.sigstore.json \
            --repo "$GITHUB_REPOSITORY" --clobber

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, android, ios, os-image]
    # The server and web app must succeed. A failed Android, iOS or OS-image job
    # leaves its files out of this release rather than stopping it; its job shows red.
    # The Docker image is not built yet: it follows on Publish (the docker job).
    if: >-
      always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      && needs.build-backend.result == 'success' && needs.build-frontend.result == 'success'
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ./artifacts
      # Release notes are the CHANGELOG.md section for this version, written
      # by a person; the commit list is only a fallback for a missing section.
      - name: Release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          awk -v v="${VERSION#v}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              { echo "## Changes since $PREV_TAG"; echo; git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD; } > NOTES.md
            else
              echo "## Initial release" > NOTES.md
            fi
          fi
          # Which OS file fits which machine, after the changelog's own words.
          { echo; cat medbrains/os/release-files.md; } >> NOTES.md
      # One tool for both lockfiles: syft reads Cargo.lock and pnpm-lock.yaml
      # (every crate and npm package that can reach the server and web app),
      # in CycloneDX, the format hospital procurement and scanners ask for.
      # cargo-cyclonedx would only cover the Rust half and writes one file per crate.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: medbrains
          format: cyclonedx-json
          output-file: dist/medbrains-source.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Tarballs, SBOMs and checksums
        run: |
          for a in x86-64 arm64; do
            tar -czf "dist/medbrains-server-bins-linux-$a.tar.gz" -C "artifacts/bins-$a" .
          done
          tar -czf dist/medbrains-web-dist.tar.gz -C artifacts web-dist
          find artifacts/android artifacts/ios artifacts/os-* -type f -exec cp {} dist/ \;
          cd dist && sha256sum -- * > SHA256SUMS
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the checksums (keyless)
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # Draft: the owner presses Publish, which starts the docker job (image push,
      # signing, image SBOM). Nothing is public before that. The desktop job adds
      # its own installers and SHA256SUMS-desktop-<os> to this draft afterwards.
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=()
          case "$TAG" in *-alpha*|*-beta*|*-rc*) pre=(--prerelease) ;; esac
          # A re-run of the same tag replaces the files instead of failing on the existing draft.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes-file NOTES.md "${pre[@]}"
          fi
      # The desktop job uploads its installers, signatures and latest.json here.
      - name: Release id
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: echo "id=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop client
    needs: [release]
    # On a tag, after the draft exists (the installers upload to it). On a manual run the
    # release job is skipped and this builds the installers unsigned, as workflow artifacts.
    if: >-
      always() && (needs.release.result == 'success'
      || (github.event_name == 'workflow_dispatch' && needs.release.result == 'skipped'))
    permissions:
      contents: write
    # No secrets passed: the desktop job reads its signing secrets from the
    # `release` environment (tag-only), which a caller cannot pass anyway.
    uses: ./.github/workflows/desktop.yml
    with:
      release-id: ${{ needs.release.outputs.release-id }}

  release-files:
    # The last step of a tag run, once the desktop installers are on the draft: one SHA256SUMS
    # over every file on the release (re-signed, the draft is still unpublished), provenance for
    # the files the release job did not attest, and a "which file for which device" table in
    # the notes, written from the files actually there.
    name: Checksums and device table
    needs: [release, desktop]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checksum the files the release job did not
        id: sums
        run: |
          mkdir -p new && cd new
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir ..
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > ../names
          while read -r name; do
            case "$name" in SHA256SUMS*) continue ;; esac
            # sha256sum writes "<hash>  <name>"; a name already listed is already summed.
            awk -v n="$name" '$2 == n { f = 1 } END { exit !f }' ../SHA256SUMS || gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir .
          done < ../names
          if [ -n "$(ls -A)" ]; then sha256sum -- * >> ../SHA256SUMS; echo "new=true" >> "$GITHUB_OUTPUT"; fi
          cd .. && sort -k2 -o SHA256SUMS SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.sums.outputs.new == 'true'
        with:
          subject-path: new/*
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign and upload the checksums
        run: |
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          gh release upload "$TAG" SHA256SUMS SHA256SUMS.sigstore.json --repo "$GITHUB_REPOSITORY" --clobber
      - name: Which file for which device
        run: |
          {
            echo "## Which file for which device"
            echo
            echo "Files marked \`-unsigned\` are not code-signed: Android and iOS will not install them, and Windows and macOS warn before opening them. Check any file against \`SHA256SUMS\` first."
            echo
            echo "| File | Device |"
            echo "|---|---|"
            while read -r n; do
              case "$n" in
                *-android*.apk) d="Android phone or tablet: install directly (sideload)" ;;
                *-android*.aab) d="Android: Google Play upload bundle, not installable" ;;
                *-ios*.ipa) d="iPhone or iPad: App Store Connect upload (TestFlight / App Store)" ;;
                *-ios*.xcarchive.zip) d="iPhone or iPad: unsigned Xcode archive, for signing by hand" ;;
                *.dmg) d="Mac (Apple silicon and Intel): desktop client installer" ;;
                *.app.tar.gz) d="Mac: desktop client auto-update package (the app downloads it)" ;;
                *.msi) d="Windows PC: desktop client installer (MSI, for IT deployment)" ;;
                *setup*.exe) d="Windows PC: desktop client installer" ;;
                *.AppImage) d="Linux PC (any distribution): desktop client, run directly" ;;
                *.deb) d="Linux PC (Debian, Ubuntu): desktop client package" ;;
                *.rpm) d="Linux PC (Fedora, RHEL, openSUSE): desktop client package" ;;
                medbrains-os-*x86-64*) d="Hospital server or PC, x86-64: MedBrains OS disk image, write to USB or disk" ;;
                medbrains-os-*arm64*) d="Hospital server or board, ARM64: MedBrains OS disk image, write to USB or disk" ;;
                medbrains-server-bins-linux-x86-64*) d="Existing Linux server, x86-64: server binaries" ;;
                medbrains-server-bins-linux-arm64*) d="Existing Linux server, ARM64: server binaries" ;;
                medbrains-web-dist*) d="Server: the web app the server serves" ;;
                *) continue ;;
              esac
              echo "| \`$n\` | $d |"
            done < names
          } > table.md
          # A re-run replaces the table rather than adding a second one.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
            | sed '/^## Which file for which device$/,$d' > notes.md
          { cat notes.md; echo; cat table.md; } > body.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file body.md
