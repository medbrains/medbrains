# Release artefacts on a version tag. Moved from medbrains/.github/workflows/
# (never read there).
#
# Tags and manual runs only. At the old location the docker job had no tag
# guard and would have pushed an image to GHCR on every push to master once
# this went live. Production is built with cargo-zigbuild on the operator's
# machine (ENGINEERING.md) — this workflow is a GitHub release, not the deploy.
#
# Supply chain (RFC-HOSPITAL-OS §8j, SEC1): the image is signed with cosign
# keyless (GitHub OIDC, no key to lose), every artefact gets a build-provenance
# attestation, and the release carries CycloneDX SBOMs and SHA-256 checksums,
# the checksum file itself signed. Verify with the commands in
# medbrains/docs/SECURITY-RELEASE-PROCESS.md. The SDKs are never published
# from here: see publish-sdks.yml.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build-backend:
    name: Build backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medbrains
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build --release -p medbrains-server
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: medbrains-server
          path: medbrains/target/release/medbrains-server
          retention-days: 30

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medbrains
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: medbrains/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: medbrains/.nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@medbrains/web...
        env:
          NODE_ENV: production
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: medbrains/apps/web/dist
          retention-days: 30

  docker:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless signing + provenance
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: medbrains
          file: medbrains/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the image (keyless)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # The image is distroless, so this lists its few OS packages; the
      # crates and npm packages are in the source SBOM the release job makes.
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: medbrains-image.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-image
          path: medbrains-image.cdx.json
          retention-days: 30

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ./artifacts
      # Release notes are the CHANGELOG.md section for this version, written
      # by a person; the commit list is only a fallback for a missing section.
      - name: Release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          awk -v v="${VERSION#v}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              { echo "## Changes since $PREV_TAG"; echo; git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD; } > NOTES.md
            else
              echo "## Initial release" > NOTES.md
            fi
          fi
      # One tool for both lockfiles: syft reads Cargo.lock and pnpm-lock.yaml
      # (every crate and npm package that can reach the server and web app),
      # in CycloneDX, the format hospital procurement and scanners ask for.
      # cargo-cyclonedx would only cover the Rust half and writes one file per crate.
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: medbrains
          format: cyclonedx-json
          output-file: dist/medbrains-source.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Tarballs, SBOMs and checksums
        run: |
          tar -czf dist/medbrains-server-linux-x64.tar.gz -C artifacts medbrains-server
          tar -czf dist/medbrains-web-dist.tar.gz -C artifacts web-dist
          cp artifacts/sbom-image/medbrains-image.cdx.json dist/
          cd dist && sha256sum -- * > SHA256SUMS
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the checksums (keyless)
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/medbrains-server-linux-x64.tar.gz
            dist/medbrains-web-dist.tar.gz
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=()
          case "$TAG" in *-alpha*|*-beta*|*-rc*) pre=(--prerelease) ;; esac
          # A re-run of the same tag replaces the files instead of failing on the existing draft.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes-file NOTES.md "${pre[@]}"
          fi
