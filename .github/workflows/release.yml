# Release artefacts on a version tag. Moved from medbrains/.github/workflows/
# (never read there).
#
# Tags and manual runs only. At the old location the docker job had no tag
# guard and would have pushed an image to GHCR on every push to master once
# this went live. Production is built with cargo-zigbuild on the operator's
# machine (ENGINEERING.md) — this workflow is a GitHub release, not the deploy.
#
# Supply chain (RFC-HOSPITAL-OS §8j, SEC1): the image is signed with cosign
# keyless (GitHub OIDC, no key to lose), every artefact gets a build-provenance
# attestation, and the release carries CycloneDX SBOMs and SHA-256 checksums,
# the checksum file itself signed. Verify with the commands in
# medbrains/docs/SECURITY-RELEASE-PROCESS.md. The SDKs are never published
# from here: see publish-sdks.yml.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-backend:
    name: Build backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medbrains
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            medbrains/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('medbrains/**/Cargo.toml') }}
      - run: cargo build --release -p medbrains-server
      - uses: actions/upload-artifact@v4
        with:
          name: medbrains-server
          path: medbrains/target/release/medbrains-server
          retention-days: 30

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medbrains
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: medbrains/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: medbrains/.nvmrc
          cache: pnpm
          cache-dependency-path: medbrains/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@medbrains/web...
        env:
          NODE_ENV: production
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: medbrains/apps/web/dist
          retention-days: 30

  docker:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless signing + provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: medbrains
          file: medbrains/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # The image is distroless, so this lists its few OS packages; the
      # crates and npm packages are in the source SBOM the release job makes.
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: medbrains-image.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-image
          path: medbrains-image.cdx.json
          retention-days: 30

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      # Release notes are the CHANGELOG.md section for this version, written
      # by a person; the commit list is only a fallback for a missing section.
      - name: Release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          awk -v v="${VERSION#v}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              { echo "## Changes since $PREV_TAG"; echo; git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD; } > NOTES.md
            else
              echo "## Initial release" > NOTES.md
            fi
          fi
      # One tool for both lockfiles: syft reads Cargo.lock and pnpm-lock.yaml
      # (every crate and npm package that can reach the server and web app),
      # in CycloneDX, the format hospital procurement and scanners ask for.
      # cargo-cyclonedx would only cover the Rust half and writes one file per crate.
      - uses: anchore/sbom-action@v0
        with:
          path: medbrains
          format: cyclonedx-json
          output-file: dist/medbrains-source.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Tarballs, SBOMs and checksums
        run: |
          tar -czf dist/medbrains-server-linux-x64.tar.gz -C artifacts medbrains-server
          tar -czf dist/medbrains-web-dist.tar.gz -C artifacts web-dist
          cp artifacts/sbom-image/medbrains-image.cdx.json dist/
          cd dist && sha256sum -- * > SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: Sign the checksums (keyless)
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/medbrains-server-linux-x64.tar.gz
            dist/medbrains-web-dist.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          body_path: NOTES.md
          files: dist/*
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
