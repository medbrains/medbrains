name: FHIR validator

# The official HL7 validator over the bundles our builders produce — the 8
# ABDM hiTypes and the NHCX messages — against the NRCeS IG ndhm.in#6.5.0,
# both pinned by sha256 in medbrains/scripts/check_fhir_validator.py.
#
# PRs that touch FHIR or NHCX code run offline (`-tx n/a`); the nightly run
# also checks codes against tx.fhir.org. Every bundle is synthetic test data,
# so nothing real leaves CI. Java is installed here only: it never ships in
# the product.

on:
  pull_request:
    branches: [master, main]
    paths:
      - "medbrains/crates/medbrains-fhir/**"
      - "medbrains/crates/medbrains-fhir-api/**"
      - "medbrains/crates/medbrains-facilities/src/nhcx_*"
      - "medbrains/crates/medbrains-core/src/nhcx*"
      - "medbrains/crates/medbrains-nhcx-callback/src/payments.rs"
      - "medbrains/scripts/check_fhir_validator.py"
      - "medbrains/scripts/fhir_validator_allowlist.json"
      - "medbrains/scripts/nrces_profile_fixture.py"
      - ".github/workflows/fhir-validator.yml"
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

permissions:
  contents: read

jobs:
  validate:
    name: HL7 validator (ndhm.in 6.5.0)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: medbrains
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            medbrains/target
          key: ${{ runner.os }}-cargo-fhir-${{ hashFiles('medbrains/**/Cargo.lock') }}
      # The validator jar, the IG package and the FHIR core packages the
      # validator pulls in; the script re-checks the pinned hashes.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/medbrains-fhir
            ~/.fhir/packages
          key: fhir-validator-6.3.11-ndhm.in-6.5.0
      - name: Validate (offline terminology)
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_fhir_validator.py
      - name: Validate (tx.fhir.org)
        if: github.event_name != 'pull_request'
        run: python3 scripts/check_fhir_validator.py --tx https://tx.fhir.org/r4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fhir-validator-report
          path: |
            medbrains/target/fhir-validator-report.json
            medbrains/target/fhir-golden/
