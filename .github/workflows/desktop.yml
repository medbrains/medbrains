name: Desktop Build

# The MedBrains desktop client (medbrains/apps/desktop). Called by release.yml
# for a version tag, so the installers, their updater signatures and
# latest.json land on the same GitHub release as the server: the updater reads
# https://github.com/medbrains/medbrains/releases/latest/download/latest.json,
# and a separate desktop-only release would move "latest" away from it.
# A manual run builds the installers as workflow artifacts and publishes nothing.
#
# Updates are signed with TAURI_SIGNING_PRIVATE_KEY. Without that secret the
# installers are still built, with no updater artifacts and no latest.json.
on:
  workflow_call:
    inputs:
      release-id:
        description: The GitHub release (database id) to upload to.
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target.os }} (${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: macOS, arch: universal, runner: macos-14, args: --target universal-apple-darwin }
          - { os: Windows, arch: x86_64, runner: windows-latest, args: '' }
          - { os: Linux, arch: x86_64, runner: ubuntu-22.04, args: '--bundles deb,appimage,rpm' }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: medbrains/package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: medbrains/.nvmrc

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}


      - name: Install Linux deps
        if: matrix.target.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JS deps
        working-directory: medbrains
        run: pnpm install --frozen-lockfile

      - name: Build SPA
        working-directory: medbrains
        run: pnpm --filter "@medbrains/types" --filter "@medbrains/utils" --filter "@medbrains/schemas" --filter "@medbrains/api" --filter "@medbrains/stores" --filter "@medbrains/expressions" --filter "@medbrains/crdt" build && pnpm --filter @medbrains/web exec vite build

      # Updater artifacts need the signing key; a build without it still ships.
      - name: Updater signing
        id: updater
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without updater artifacts or latest.json"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code-signing (set when secrets exist; otherwise unsigned dev build)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code-signing
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Tauri updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: medbrains/apps/desktop
          args: ${{ matrix.target.args }} ${{ steps.updater.outputs.args }}
          releaseId: ${{ inputs.release-id }}
          includeUpdaterJson: ${{ steps.updater.outputs.signed == 'true' }}

      - name: Keep the installers (manual runs)
        if: inputs.release-id == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target.os }}
          path: |
            medbrains/target/**/release/bundle/**/*.dmg
            medbrains/target/**/release/bundle/**/*.msi
            medbrains/target/**/release/bundle/**/*.exe
            medbrains/target/**/release/bundle/**/*.deb
            medbrains/target/**/release/bundle/**/*.AppImage
            medbrains/target/**/release/bundle/**/*.rpm
          retention-days: 14
