name: Desktop Build

# The MedBrains desktop client (medbrains/apps/desktop). Called by release.yml
# for a version tag, so the installers, their updater signatures and
# latest.json land on the same GitHub release as the server: the updater reads
# https://github.com/medbrains/medbrains/releases/latest/download/latest.json,
# and a separate desktop-only release would move "latest" away from it.
# A manual run builds the installers as workflow artifacts and publishes nothing.
#
# Updates are signed with TAURI_SIGNING_PRIVATE_KEY. Without that secret the
# installers are still built, with no updater artifacts and no latest.json.
# Operating-system code signing is separate: the macOS build is signed (and notarized)
# only with the Apple secrets, the Windows build only with WINDOWS_CERTIFICATE; a release
# without them uploads that platform's installers named -unsigned. Linux packages carry
# no code signature; SHA256SUMS (release.yml, release-files) covers them.
# The signing secrets live only in the `release` environment, whose
# deployment rule admits `v*` tags; a job joins it only when it has a release
# to upload to, so a manual run never signs and never sees the secrets.
# release.yml passes no secrets: a caller cannot hand environment secrets to a
# reusable workflow, the job reads them from the environment itself.
on:
  workflow_call:
    inputs:
      release-id:
        description: The GitHub release (database id) to upload to.
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target.os }} (${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.runner }}
    # An empty name runs the job outside any environment (manual runs).
    environment: ${{ inputs.release-id != '' && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: macOS, arch: universal, runner: macos-15, args: --target universal-apple-darwin }
          - { os: Windows, arch: x86_64, runner: windows-latest, args: '' }
          - { os: Linux, arch: x86_64, runner: ubuntu-22.04, args: '--bundles deb,appimage,rpm' }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: medbrains/package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: medbrains/.nvmrc

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}


      # medbrains/rust-toolchain.toml pins the toolchain cargo actually uses, so the targets must
      # be added to that toolchain too (the step above only covers `stable`).
      - name: Add the macOS targets to the pinned toolchain
        if: matrix.target.os == 'macOS'
        working-directory: medbrains
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install Linux deps
        if: matrix.target.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # The app's version is the workspace version (tauri.conf.json has none, so Tauri takes the
      # crate's, which is `version.workspace`). The updater compares it with latest.json's, so a
      # release tag must name the same version (scripts/app_version.sh), and a pre-release tag
      # (v3.33.0-rc1) puts its suffix on the app so the updater can order it.
      - name: App version from the tag
        if: inputs.release-id != ''
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ "$TAG" != v* || ! "$version" =~ $semver ]]; then
            echo "::error::Release tag '$TAG' is not v<semver>; refusing to build an app the updater cannot order"
            exit 1
          fi
          medbrains/scripts/app_version.sh "$TAG"
          node -e '
            const fs = require("fs");
            const path = "medbrains/apps/desktop/src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(path, "utf8"));
            conf.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + "\n");
          ' "$version"
          echo "Desktop version $version"

      - name: Install JS deps
        working-directory: medbrains
        run: pnpm install --frozen-lockfile

      - name: Build SPA
        working-directory: medbrains
        run: pnpm --filter "@medbrains/types" --filter "@medbrains/utils" --filter "@medbrains/schemas" --filter "@medbrains/api" --filter "@medbrains/stores" --filter "@medbrains/expressions" --filter "@medbrains/crdt" build && pnpm --filter @medbrains/web exec vite build

      # Updater artifacts need the signing key and a release; a build without
      # them still ships installers.
      - name: Updater signing
        id: updater
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RELEASE_ID: ${{ inputs.release-id }}
        run: |
          if [ -z "$RELEASE_ID" ]; then
            echo "Manual run without a release: building unsigned, with no updater artifacts"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$KEY" ]; then
            echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without updater artifacts or latest.json"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # An empty signing variable makes tauri try to import an empty certificate and fail, so
      # export each one only when its secret is set. Without them the build is unsigned.
      # Notarization takes either an App Store Connect API key (the one the iOS job's secrets
      # name, mapped to tauri's APPLE_API_* variables) or an Apple ID app password.
      - name: macOS code-signing variables, only when set
        if: matrix.target.os == 'macOS'
        id: macsign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        shell: bash
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID \
                   APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH; do
            if [ -n "${!v}" ]; then
              d="EOF_$RANDOM$RANDOM"
              { echo "$v<<$d"; printf '%s\n' "${!v}"; echo "$d"; } >> "$GITHUB_ENV"
            fi
          done
          [ -n "$APPLE_CERTIFICATE" ] && echo "signed=true" >> "$GITHUB_OUTPUT" || true
      # Tauri signs Windows bundles with a certificate in the store, named by thumbprint: import
      # the PFX and hand tauri the thumbprint through one more config file.
      - name: Windows code-signing certificate, only when set
        if: matrix.target.os == 'Windows'
        id: winsign
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          $conf = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } }
          $conf | ConvertTo-Json -Depth 4 | Set-Content medbrains/apps/desktop/src-tauri/tauri.windows-sign.conf.json
          "args=--config src-tauri/tauri.windows-sign.conf.json" >> $env:GITHUB_OUTPUT
          "signed=true" >> $env:GITHUB_OUTPUT
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple and Windows code-signing variables are exported by the step above, only when set.
          # Tauri updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: medbrains/apps/desktop
          args: ${{ matrix.target.args }} ${{ steps.updater.outputs.args }} ${{ steps.winsign.outputs.args }} -- --locked
          releaseId: ${{ inputs.release-id }}
          uploadUpdaterJson: ${{ steps.updater.outputs.signed == 'true' }}
          # Not code-signed on macOS or Windows: say so in the uploaded names (latest.json uses them too).
          releaseAssetNamePattern: >-
            ${{ matrix.target.os != 'Linux' && steps.macsign.outputs.signed != 'true' && steps.winsign.outputs.signed != 'true'
            && '[name]_[version]_[arch][setup]-unsigned[ext]' || '' }}

      - name: Keep the installers (manual runs)
        if: inputs.release-id == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target.os }}
          path: |
            medbrains/target/**/release/bundle/**/*.dmg
            medbrains/target/**/release/bundle/**/*.msi
            medbrains/target/**/release/bundle/**/*.exe
            medbrains/target/**/release/bundle/**/*.deb
            medbrains/target/**/release/bundle/**/*.AppImage
            medbrains/target/**/release/bundle/**/*.rpm
          retention-days: 14
