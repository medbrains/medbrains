name: 🐞 Bug report
description: Something isn't working as expected
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Do not include real patient data (PHI).** For security vulnerabilities, use [SECURITY.md](../blob/master/SECURITY.md) instead — not a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend (Rust/Axum)
        - Web (React)
        - Mobile / TV
        - Database / migration
        - Auth / permissions
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit/branch, OS, browser, deployment (local/self-hosted), PostgreSQL version.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Paste logs or attach screenshots. Redact anything sensitive.
      render: shell
