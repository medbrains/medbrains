name: 🐞 Bug report
description: Something isn't working as expected
labels: ["bug", "needs-triage", "status:intake"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Do not include real patient data (PHI).** For security vulnerabilities, use [SECURITY.md](../blob/main/SECURITY.md) instead — not a public issue.
  - type: checkboxes
    id: no-phi
    attributes:
      label: Privacy
      options:
        - label: This report contains no real patient data — no names, UHIDs, phone numbers, photos or screenshots of real records.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true
  - type: input
    id: screen
    attributes:
      label: Screen and role
      description: The screen it happened on, and the role signed in (doctor, nurse, front office and so on).
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: How bad is it?
      options:
        - "S1: a patient could be harmed, data is lost or exposed, or the hospital cannot work"
        - "S2: a main task is broken, but there is a way round it"
        - "S3: something is wrong outside the main tasks"
        - "S4: polish"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen instead?
      description: One line is enough. It becomes the test that proves the fix.
      placeholder: "Given …, when …, then …"
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend (Rust/Axum)
        - Web (React)
        - Pharmacy / medicines
        - Billing / insurance
        - OS box / setup / ward PCs
        - Desktop app (Windows / Mac)
        - Mobile (iOS / Android) / TV
        - Database / migration
        - Auth / permissions
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit/branch, OS, browser, deployment (local/self-hosted), PostgreSQL version.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Paste logs or attach screenshots. Redact anything sensitive.
      render: shell
