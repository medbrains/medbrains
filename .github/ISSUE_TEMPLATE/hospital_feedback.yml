name: 🏥 Feedback from a hospital
description: Something in daily hospital work is slow, confusing or missing
labels: ["feedback", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us how MedBrains fits your day. **Never include real patient data.** For a fault that stops work, use the bug report instead.
  - type: checkboxes
    id: no-phi
    attributes:
      label: Privacy
      options:
        - label: This contains no real patient data.
          required: true
  - type: dropdown
    id: role
    attributes:
      label: Your role
      options: [Doctor, Nurse, Pharmacist, Front office / reception, Ward secretary / admission, Lab, Billing, MRD, Hospital admin / IT, Owner / management, Other]
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: What got in the way, and what would help?
    validations:
      required: true
