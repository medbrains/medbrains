# Actions are pinned to commit SHAs (zizmor unpinned-uses). This keeps those pins
# current: one grouped PR a month, and a security fix as soon as one is published.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
