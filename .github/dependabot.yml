# Moved from medbrains/.github/ (never read there). Manifests live under
# /medbrains. `reviewers:` dropped: it named org teams this user-owned repo
# cannot have, and CODEOWNERS now assigns review.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /medbrains
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
    commit-message:
      prefix: "chore(deps):"
    groups:
      rust-minor:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /medbrains
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    labels: [dependencies, javascript]
    commit-message:
      prefix: "chore(deps):"
    groups:
      mantine:
        patterns: ["@mantine/*"]
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      tanstack:
        patterns: ["@tanstack/*"]
      testing:
        patterns: [vitest, "@vitest/*", "@testing-library/*", "@playwright/*"]
      dev-tools:
        patterns: [typescript, "@biomejs/*", vite, "@vitejs/*", turbo]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "chore(ci):"

  - package-ecosystem: docker
    directory: /medbrains
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 2
    labels: [dependencies, docker]
    commit-message:
      prefix: "chore(docker):"
