# SonarQube Cloud settings for .github/workflows/sonarqube.yml.
# The organization and project key are the ones SonarQube Cloud gives when the
# repo is imported; change these two lines if it shows different ones.
sonar.organization=medbrains
sonar.projectKey=medbrains_medbrains
sonar.projectName=MedBrains

# What we ship and maintain. The old React Native apps (reference only), vendored
# crates, generated code and build output are left out.
sonar.sources=medbrains/crates,medbrains/apps/web/src,medbrains/packages,medbrains/apps/ios,medbrains/apps/android,medbrains/apps/desktop/src-tauri/src,medbrains/os,medbrains/scripts,medbrains/infra,website/src
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/build/**,**/.sqlx/**,**/vendor/**,**/migrations-archive/**,**/*.generated.*,medbrains/packages/types/src/permissions.ts,medbrains/packages/types/src/permission-catalog.ts,medbrains/crates/medbrains-shell/src/*.css,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,medbrains/apps/web/src/test/**
sonar.tests=medbrains/crates,medbrains/apps/web/src
sonar.test.inclusions=**/tests/**,**/*_test.rs,**/*.test.ts,**/*.test.tsx,**/*.spec.ts
sonar.sourceEncoding=UTF-8

# Coverage. Web: LCOV written by the workflow's vitest run, on every analysis.
# Rust: LCOV from cargo llvm-cov, passed by the workflow as sonar.rust.lcov.reportPaths only
# on main pushes, the nightly run and manual dispatch (PR analyses have web coverage only).
sonar.javascript.lcov.reportPaths=medbrains/apps/web/coverage/lcov.info

# The OS screen's stylesheet is GTK CSS (selectors like `window` and `stack`), not web CSS,
# so SonarQube's web-CSS rules report it falsely. It is excluded above.
# sonar.projectVersion is passed by the workflow from medbrains/Cargo.toml, so SonarQube's
# "new code" is measured per release (set New Code to "Previous version" in SonarQube Cloud).

# Findings that do not apply, recorded here so the reason is reviewable in git:
# - medbrains/scripts and medbrains/os/*.py are developer and build tools run by hand or in CI
#   with the operator's own arguments and files; "argument injection" and "path traversal from a
#   command-line argument" assume an untrusted caller, which these tools never have.
# - secrets:S2068 inside test code: the "passwords" are fixtures that assert scrubbing works.
sonar.issue.ignore.multicriteria=py1,py2,py3,sec1,sec2
sonar.issue.ignore.multicriteria.py1.ruleKey=pythonsecurity:*
sonar.issue.ignore.multicriteria.py1.resourceKey=medbrains/scripts/**/*.py
sonar.issue.ignore.multicriteria.py2.ruleKey=pythonsecurity:*
sonar.issue.ignore.multicriteria.py2.resourceKey=medbrains/os/**/*.py
sonar.issue.ignore.multicriteria.py3.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.py3.resourceKey=medbrains/scripts/demo-seed/**/*.py
sonar.issue.ignore.multicriteria.sec1.ruleKey=secrets:S2068
sonar.issue.ignore.multicriteria.sec1.resourceKey=medbrains/crates/medbrains-os-setup/src/main.rs
sonar.issue.ignore.multicriteria.sec2.ruleKey=secrets:S2068
sonar.issue.ignore.multicriteria.sec2.resourceKey=medbrains/crates/medbrains-shell/src/api.rs
