# SonarQube Cloud settings for .github/workflows/sonarqube.yml.
# The organization and project key are the ones SonarQube Cloud gives when the
# repo is imported; change these two lines if it shows different ones.
sonar.organization=medbrains
sonar.projectKey=medbrains_medbrains
sonar.projectName=MedBrains

# What we ship and maintain. The old React Native apps (reference only), vendored
# crates, generated code and build output are left out.
sonar.sources=medbrains/crates,medbrains/apps/web/src,medbrains/packages,medbrains/apps/ios,medbrains/apps/android,medbrains/apps/desktop/src-tauri/src,medbrains/os,medbrains/scripts,medbrains/infra,website/src
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/build/**,**/.sqlx/**,**/vendor/**,**/migrations-archive/**,**/*.generated.*,medbrains/packages/types/src/permissions.ts,medbrains/packages/types/src/permission-catalog.ts
sonar.tests=medbrains/crates
sonar.test.inclusions=**/tests/**,**/*_test.rs,**/*.test.ts,**/*.test.tsx,**/*.spec.ts
sonar.sourceEncoding=UTF-8
