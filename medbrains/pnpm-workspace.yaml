packages:
  - "packages/*"
  - "apps/*"

# pnpm audit ignores. Each line: the advisory, why it cannot reach a patient,
# and when it must be re-decided. scripts/check_audit_ignores.py fails CI once
# an expiry passes. Gate: `pnpm audit --prod --audit-level=high` (security.yml).
auditConfig:
  ignoreGhsas:
    - GHSA-5p2g-fcmc-qvqq # image-size: metro bundler (RN build), images are our own assets. expires 2027-01-31
    - GHSA-w3rx-r6r6-pgpr # image-size: metro bundler (RN build), images are our own assets. expires 2027-01-31
