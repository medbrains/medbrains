# cargo-nextest settings. The `ci` profile is what ci.yml's Rust tests job runs: every
# failure reported (no fail-fast) and a JUnit file for the PR's per-test summary.
[profile.ci]
fail-fast = false
# One test at a time, as `cargo test` runs them under .cargo/config.toml's
# RUST_TEST_THREADS=1: the server's integration tests share one hospital in one database.
test-threads = 1

[profile.ci.junit]
path = "junit.xml"

# Quarantine (#5978): CI's Rust tests block merges, so a test that flakes is fixed or
# listed here by exact name with its issue, never skipped quietly. Empty today: the two
# failures seen on 2026-11-14..16 were fixed (#5989, #5990). To quarantine, add under
# [profile.ci]:  default-filter = "not test(=module::test_name)"  # #issue
