[package]
name = "medbrains-authz-spicedb"
publish = false
description = "The SpiceDB authorisation backend: gRPC client, durable outbox and watcher. Kept out of medbrains-authz so the kernel and every crate that only asks questions do not compile a gRPC stack"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license-file.workspace = true

[lints]
workspace = true

[dependencies]
medbrains-authz = { path = "../medbrains-authz" }
# Generated in-house from the official authzed/api protos; see
# crates/medbrains-spicedb-proto/proto/README.md for the pinned sources.
medbrains-spicedb-proto = { path = "../medbrains-spicedb-proto" }
anyhow.workspace = true
async-trait = "0.1.92"
chrono = { workspace = true }
prost = "0.14.3"
prost-types = "0.14.3"
serde_json = { workspace = true }
sha2.workspace = true
sqlx = { workspace = true }
tokio = { workspace = true }
tonic = "0.14.5"
tracing = { workspace = true }
uuid = { workspace = true }

[[bin]]
name = "spicedb-schema-write"
path = "src/bin/schema_write.rs"

[[bin]]
name = "lookup-probe"
path = "src/bin/lookup_probe.rs"
