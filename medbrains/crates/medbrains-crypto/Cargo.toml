[package]
name = "medbrains-crypto"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# JOSE primitives — JWE (RSA-OAEP-256 / ECDH-ES + A256GCM) and
# JWS (RS256 / ES256). NHCX requires JWE; ABDM HIE requires JWE+JWS
# at message envelopes. josekit is a mature, audited Rust impl.
josekit = "0.8"

# josekit pulls in openssl-sys; force `vendored` so cross-compiles
# (mac arm64 → linux arm64 via cargo-zigbuild) build OpenSSL from
# source instead of requiring a cross-arch libssl-dev sysroot.
openssl = { version = "0.10", features = ["vendored"] }

# Base64 + AES-GCM + HKDF for ABDM's Fidelius transfer encryption
# (ECDH on Weierstrass Curve25519 runs on the openssl dependency above).
base64 = "0.22"
aes-gcm = "0.10"
hkdf = "0.12"
sha2.workspace = true
rand = { version = "0.9" }

# UHI (Beckn) HTTP signatures: ed25519 over a BLAKE2b-512 body digest.
ed25519-dalek = { workspace = true }
blake2 = "0.10"
