[package]
name = "medbrains-outbox"
publish = false
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
medbrains-core = { path = "../medbrains-core" }
medbrains-crypto = { path = "../medbrains-crypto" }
medbrains-adapter-sdk = { path = "../medbrains-adapter-sdk" }

async-trait = "0.1.92"
chrono = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
lettre = { version = "0.11.22", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
base64.workspace = true
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
urlencoding = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = "0.6"
