[package]
name = "medbrains-edge"
publish = false
description = "Offline-first edge sync for hospital deployments — Loro CRDT-backed LAN sync hub. Open-source under Apache-2.0."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[dependencies]
medbrains-core = { path = "../medbrains-core" }
medbrains-offline-core = { path = "../medbrains-offline-core" }

# Async runtime + WebSocket sync server
tokio = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
async-trait = { workspace = true }
futures = { workspace = true }

# CRDT engine
loro = { workspace = true }

# LAN service discovery (mDNS)
mdns-sd = { workspace = true }

# Serialization + types
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

# Logging
tracing = { workspace = true }

# Errors
thiserror = { workspace = true }
anyhow = { workspace = true }

# Hashing for the Merkle audit chain
sha2 = { workspace = true }
# iroh 1.x is wire-incompatible with 0.92: the edge box and every device that
# dials it must ship the same major together. mDNS moved out of iroh into
# iroh-mdns-address-lookup.
iroh = { version = "1.4.1", optional = true }
iroh-mdns-address-lookup = { version = "0.6.1", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

[features]
iroh = ["dep:iroh", "dep:iroh-mdns-address-lookup"]
