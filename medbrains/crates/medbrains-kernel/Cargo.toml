[package]
name = "medbrains-kernel"
publish = false
description = "The MedBrains kernel facade — the one interface apps use for tenancy, authorisation, audit, events, config, sequences and storage. Technical only (RFC-HOSPITAL-OS §3a)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

# Kernel building blocks. Everything the kernel wraps lives in these crates;
# scripts/check_kernel_boundary.py reads this list to tell apps from building blocks.
# No web framework, here or below: scripts/check_size_budgets.py ratchets the closure.
[dependencies]
medbrains-authz = { path = "../medbrains-authz" }
medbrains-core = { path = "../medbrains-core" }
medbrains-db = { path = "../medbrains-db" }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
