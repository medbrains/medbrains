# MedBrains Proxy — Pingora with SNI multi-cert
# Each route can have its own cert_path/key_path for proper SNI

http_port = 80
https_port = 443
body_limit_bytes = 26214400
block_source_maps = true
downstream_read_timeout_ms = 30000
downstream_write_timeout_ms = 30000
upstream_connect_timeout_ms = 5000
upstream_total_timeout_ms = 15000
upstream_read_timeout_ms = 60000
upstream_idle_timeout_ms = 60000
drain_timeout_ms = 1000

[[edge_policies]]
prefix = "/api/sync/"
class = "outbox"
body_limit_bytes = 52428800
upstream_total_timeout_ms = 120000
upstream_read_timeout_ms = 120000
require_idempotency_key = true
retry_after_seconds = 10
cache_control = "no-store"
allowed_methods = ["GET", "POST", "PUT", "PATCH", "OPTIONS"]

[[edge_policies]]
prefix = "/api/outbox/"
class = "outbox"
body_limit_bytes = 52428800
upstream_total_timeout_ms = 120000
upstream_read_timeout_ms = 120000
require_idempotency_key = true
retry_after_seconds = 10
cache_control = "no-store"
allowed_methods = ["GET", "POST", "PUT", "PATCH", "OPTIONS"]

[[edge_policies]]
prefix = "/api/client-errors"
class = "telemetry"
body_limit_bytes = 2097152
upstream_total_timeout_ms = 15000
upstream_read_timeout_ms = 30000
retry_after_seconds = 30
cache_control = "no-store"
allowed_methods = ["POST", "OPTIONS"]

[[edge_policies]]
prefix = "/api/"
class = "api"
body_limit_bytes = 26214400
upstream_total_timeout_ms = 15000
upstream_read_timeout_ms = 60000
retry_after_seconds = 5
cache_control = "no-store"
allowed_methods = ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]

[[edge_policies]]
prefix = "/ws"
class = "websocket"
upstream = "127.0.0.1:7811"
body_limit_bytes = 1048576
upstream_total_timeout_ms = 3600000
upstream_read_timeout_ms = 3600000
retry_after_seconds = 5
cache_control = "no-store"
allowed_methods = ["GET", "OPTIONS"]

[[edge_policies]]
prefix = "/assets/"
class = "assets"
body_limit_bytes = 1048576
upstream_total_timeout_ms = 10000
upstream_read_timeout_ms = 30000
cache_control = "public, max-age=31536000, immutable"
allowed_methods = ["GET", "HEAD", "OPTIONS"]

[[edge_policies]]
prefix = "/"
class = "spa"
body_limit_bytes = 1048576
upstream_total_timeout_ms = 15000
upstream_read_timeout_ms = 30000
retry_after_seconds = 5
cache_control = "no-store"
allowed_methods = ["GET", "HEAD", "OPTIONS"]

[[routes]]
domain = "medbrains.alagappahospital.com"
upstream = "127.0.0.1:3000"
cert_path = "/etc/letsencrypt/live/medbrains.alagappahospital.com/fullchain.pem"
key_path = "/etc/letsencrypt/live/medbrains.alagappahospital.com/privkey.pem"

[[routes]]
domain = "email.alagappa.org"
upstream = "127.0.0.1:8080"
cert_path = "/etc/letsencrypt/live/email.alagappa.org/fullchain.pem"
key_path = "/etc/letsencrypt/live/email.alagappa.org/privkey.pem"

[[routes]]
domain = "autodiscover.email.alagappa.org"
upstream = "127.0.0.1:8080"

[[routes]]
domain = "charts.alagappa.org"
upstream = "127.0.0.1:8088"

[[routes]]
domain = "wiki.alagappa.org"
upstream = "127.0.0.1:3333"
