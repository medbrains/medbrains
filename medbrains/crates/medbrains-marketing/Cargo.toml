[package]
name = "medbrains-marketing"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
medbrains-server-core = { path = "../medbrains-server-core" }
medbrains-core = { path = "../medbrains-core" }
medbrains-db = { path = "../medbrains-db" }
# For generate_uhid. Converting a lead must mint a UHID the same way
# registration does, not invent a second numbering scheme.
medbrains-patients = { path = "../medbrains-patients" }
# The dispatcher queues through the existing outbox rather than building a
# second delivery pipeline with a second set of retry bugs.
medbrains-outbox = { path = "../medbrains-outbox" }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
rust_decimal = { workspace = true }

[lints]
workspace = true
