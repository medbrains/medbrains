[package]
name = "medbrains-error-tracking"
publish = false
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Sentry SDK reporting to a self-hosted Rustrak, with every report scrubbed of patient data"

[dependencies]
medbrains-kernel = { path = "../medbrains-kernel" }
medbrains-core = { path = "../medbrains-core" }
medbrains-server-core = { path = "../medbrains-server-core" }
axum = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
sentry = { version = "0.49.3", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "release-health",
    "reqwest",
    "rustls",
    "tracing",
    "tower-axum-matched-path",
] }

[dev-dependencies]
sentry = { version = "0.49.3", default-features = false, features = ["test"] }

[lints]
workspace = true
