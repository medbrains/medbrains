[package]
name = "medbrains-core"
publish = false
description = "Domain types for MedBrains HMS — zero framework dependencies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
rust_decimal = { workspace = true }
# Redacting identifiers from text bound for any AI model (ai_redact).
regex = { workspace = true }

# Hybrid deploy mode infrastructure (deploy_mode + secrets +
# audit_sink + object_store + jwt_signer modules). tokio for async fs;
# async-trait for the trait Sigs; ed25519-dalek for the local JWT
# signer. These are runtime traits, not domain types — the crate
# description still holds for the rest of the modules.
tokio = { workspace = true }
async-trait = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
flate2 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
