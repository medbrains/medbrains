[package]
name = "medbrains-db-migrations"
publish = false
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

# Deliberately minimal. Every dependency added here is paid on every
# migration, because that is what this crate exists to isolate.
[dependencies]
sqlx = { workspace = true }
tracing = { workspace = true }
# Only for the `testing` feature, which test code enables as a dev-dependency;
# the server's build never compiles it.
tokio = { workspace = true, optional = true }

[features]
# Per-test copies of a migrated template database (src/testing.rs).
testing = ["dep:tokio"]

[lints]
workspace = true
