[package]
name = "medbrains-os-setup"
publish = false
description = "First-boot setup and machine controls for the OS screen. No database, no web framework."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[dependencies]
argon2 = { workspace = true }
serde_json = { workspace = true }

# Who connected to the socket: only Linux has this, and only Linux runs this. Tests also run on Macs.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["net", "time"] }

[lints]
workspace = true
