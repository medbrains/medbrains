[package]
name = "medbrains-server-core"
publish = false
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
medbrains-api-keys = { path = "../medbrains-api-keys" }
medbrains-core = { path = "../medbrains-core" }
medbrains-db = { path = "../medbrains-db" }
medbrains-crypto = { path = "../medbrains-crypto" }
medbrains-authz = { version = "0.1.0", path = "../medbrains-authz" }
medbrains-db-topology = { path = "../medbrains-db-topology" }
medbrains-outbox = { path = "../medbrains-outbox" }
medbrains-print = { version = "0.1.0", path = "../medbrains-print" }
argon2 = { workspace = true }
axum = { workspace = true }
axum-extra = { version = "0.10", features = ["cookie"] }
http-body = "1"
tower = { workspace = true }
tower-http = { workspace = true }
jsonwebtoken = { workspace = true }
time = "0.3"
tokio = { workspace = true }
futures = { workspace = true }
sqlx = { workspace = true }
url = { workspace = true }
getrandom = { workspace = true }
ipnet = "2"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
figment = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
ed25519-dalek = { workspace = true }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-config = { version = "1", default-features = false, features = ["rt-tokio"] }

[lints]
workspace = true
