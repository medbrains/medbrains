# MedBrains Bridge Agent Configuration
# Copy to bridge.toml and edit for your environment

agent_name = "Lab Bridge - Chemistry Wing"
agent_key = "mbr_bridge_change_me_to_a_secure_key"
api_base = "http://127.0.0.1:3000"

# MedBrains API key (Admin → API keys) with devices.ingest, plus
# devices.orders.send if orders go out to the analyzer.
# api_key = "mbk_..."

# SQLite buffer for offline resilience
buffer_path = "bridge_buffer.db"

# Heartbeat interval (seconds)
heartbeat_interval_secs = 30

# Buffer drain retry interval (seconds)
drain_interval_secs = 5

# HL7 MLLP listener — set to receive HL7 v2 messages from lab analyzers
hl7_listen = "0.0.0.0:2575"

# ASTM E1381/E1394 listener for Sysmex-class analyzers (serial ones through a
# serial-to-TCP converter). Point the analyzer's host connection here.
# astm_listen = "0.0.0.0:5000"

# Send collected samples' orders to the analyzer as HL7 ORM every N seconds.
# The analyzer's address is the device's host and port in MedBrains
# (Admin → Devices); needs device_instance_id.
# order_poll_secs = 15

# Print delivery: send queued print jobs (wristbands, labels, slips, pages)
# to printers every N seconds. Printers are set up in MedBrains under
# Documents → Printers with a network address (host or host:9100) or a USB
# device path on this machine (/dev/usb/lp0). Needs documents.print_jobs.deliver
# on the API key. List printer ids to serve only this site's printers.
# print_poll_secs = 3
# printer_ids = ["uuid-of-ward-3-zebra"]

# Device instance ID (from MedBrains admin → Devices → your device)
# device_instance_id = "uuid-of-device-instance"

# Deployment mode: on_premise, cloud_sidecar, embedded
deployment_mode = "on_premise"

# Card machines wired to this PC (USB / serial / Bluetooth). Register each in
# MedBrains under Settings → Payment terminals with connection "bridge", then
# list it here by its terminal id. Keep this block last: TOML puts every
# key after a [[card_terminals]] header inside that table. Needs
# billing.terminals.drive on the API key.
# card_terminal_poll_secs = 2
# [[card_terminals]]
# id = "uuid-of-counter-1-card-machine"
# adapter = "simulator"            # real ECR adapters per brand come later
# address = "/dev/ttyUSB0"
# simulator_outcome = "approve"    # approve | decline | timeout
# simulator_delay_secs = 3
