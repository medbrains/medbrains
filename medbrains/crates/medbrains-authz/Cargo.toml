[package]
name = "medbrains-authz"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
chrono = { workspace = true }
prost = "0.14.3"
prost-types = "0.14.3"
serde = { workspace = true }
serde_json = { workspace = true }
sha2.workspace = true
# Pinned exactly, not "1.49". Cargo.lock is gitignored in this repo, so a
# caret range is not a pin - every fresh checkout re-resolves forward. 1.53
# added a `with_debug` field to LookupResourcesRequest, which is a struct
# this crate constructs literally, so the range silently turned into a
# compile error on any machine that had not already accumulated a lockfile.
spicedb-rs-client = "=1.49.2"
spicedb-rs-proto = "=1.49.2"
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tonic = "0.14.5"
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "rebac-backfill"
path = "src/bin/backfill.rs"

[[bin]]
name = "spicedb-schema-write"
path = "src/bin/schema_write.rs"
