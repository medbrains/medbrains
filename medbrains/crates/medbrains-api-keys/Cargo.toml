[package]
name = "medbrains-api-keys"
publish = false
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

# Machine credentials for the API.
#
# The minting and verification logic is pure and lives here on its own, with no
# database and no web framework, so every property that matters — the format,
# the constant-time comparison, what a key may and may not be granted — is
# settled by a test rather than by reading.
[dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
subtle = "2"
thiserror = { workspace = true }

[lints]
workspace = true
