[package]
name = "medbrains-loadtest"
publish = false
version.workspace = true
edition.workspace = true

[[bin]]
name = "loadtest"
path = "src/main.rs"

[dependencies]
goose = "0.19"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# The reqwest goose builds its clients with, to hand each virtual user the shared session.
reqwest = { version = "0.13", default-features = false, features = ["default-tls"] }

# Override workspace lints — load test tooling needs relaxed rules
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
