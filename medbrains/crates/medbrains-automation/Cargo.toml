[package]
name = "medbrains-automation"
publish = false
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

# Workflow automation for MedBrains, built on the r8r engine.
#
# This crate owns the rules that make a general-purpose automation engine safe
# to run inside a hospital system: which authority a workflow acts with, what it
# is allowed to reach, and how it stays isolated from the clinical schema. It
# knows nothing about axum or about storage — those are the -api and -store
# crates, which is what lets these rules be tested without either.
#
# r8r is its own Cargo workspace (Apache-2.0), kept in this repository at
# `r8r/` beside `medbrains/` so a plain clone builds with no private parts.
[dependencies]
r8r-workflow = { path = "../../../r8r/crates/workflow" }
r8r-core = { path = "../../../r8r/crates/core" }
r8r-nodes-base = { path = "../../../r8r/crates/nodes-base" }

medbrains-core = { path = "../medbrains-core" }
async-trait = "0.1.92"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
