[package]
name = "medbrains-terminology"
publish = false
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

# SNOMED CT as a local PostgreSQL store, loaded from licensed RF2 release
# packages: import, search, hierarchy, a bounded ECL subset and analytics;
# and a hospital-loaded ICD-10 catalogue with the ICD-11/ICD-10 switch.
[dependencies]
medbrains-server-core = { path = "../medbrains-server-core" }
medbrains-core = { path = "../medbrains-core" }
medbrains-db = { path = "../medbrains-db" }
axum = { workspace = true }
chrono = { workspace = true }
csv = "1"
futures = { workspace = true }
hex = { workspace = true }
quick-xml = "0.42"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zip = { workspace = true }

[lints]
workspace = true
