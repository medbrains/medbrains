[package]
name = "medbrains-server"
description = "Axum HTTP server for MedBrains HMS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
medbrains-core = { path = "../medbrains-core" }
medbrains-db = { path = "../medbrains-db" }
medbrains-seed = { path = "../medbrains-seed" }
medbrains-server-core = { path = "../medbrains-server-core" }
medbrains-clinical-scores = { path = "../medbrains-clinical-scores" }
medbrains-clinical-ops = { path = "../medbrains-clinical-ops" }
medbrains-telehealth = { path = "../medbrains-telehealth" }
medbrains-specialty = { path = "../medbrains-specialty" }
medbrains-care-mgmt = { path = "../medbrains-care-mgmt" }
medbrains-infection-control = { path = "../medbrains-infection-control" }
medbrains-workflow = { path = "../medbrains-workflow" }
medbrains-scheduling = { path = "../medbrains-scheduling" }
medbrains-ancillary = { path = "../medbrains-ancillary" }
medbrains-community-health = { path = "../medbrains-community-health" }
# Body::size_hint for the dev payload-size logger (middleware::payload_size_log).
http-body = "1"
# jemalloc global allocator — better multithreaded heap behaviour + lower
# fragmentation tail-latency under concurrent load than the system allocator.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"
medbrains-outbox = { path = "../medbrains-outbox" }
medbrains-fhir = { path = "../medbrains-fhir" }
medbrains-crypto = { path = "../medbrains-crypto" }
medbrains-db-topology = { path = "../medbrains-db-topology" }
medbrains-abdm = { path = "../medbrains-abdm" }
async-trait = "0.1"
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
cron = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
figment = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rust_decimal = { workspace = true }
regex = { workspace = true }
url = { workspace = true }
ed25519-dalek = "2"
getrandom = { version = "0.3", features = ["std"] }
axum-extra = { version = "0.10", features = ["cookie"] }
time = "0.3"
futures = { workspace = true }
async-stream = { workspace = true }
ipnet = "2"
reqwest = { workspace = true }
rig-core = { workspace = true }
schemars = { workspace = true }
mlua = { workspace = true }
anyhow = { workspace = true }
medbrains-authz = { version = "0.1.0", path = "../medbrains-authz" }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-config = { version = "1", default-features = false, features = ["rt-tokio"] }
# Optional secrets backend — only compiled when the `aws-secrets` feature is on,
# so on-prem / dev builds don't pull the AWS Secrets Manager SDK.
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["rt-tokio"], optional = true }
totp-rs = { version = "5.7.1", features = ["otpauth", "qr"] }
# DNS verification for custom-domain setup (A/MX/SPF/DMARC lookups).
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime"] }
medbrains-print = { version = "0.1.0", path = "../medbrains-print" }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "cookies", "rustls-tls-native-roots"], default-features = false }
tokio = { version = "1", features = ["full", "test-util"] }

[features]
# Compile the AWS Secrets Manager backend (`MEDBRAINS_SECRETS_BACKEND=aws`).
# Off by default — env/file backends cover dev and on-prem with no AWS SDK.
aws-secrets = ["dep:aws-sdk-secretsmanager"]

[lints]
workspace = true
