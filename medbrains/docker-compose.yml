services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: medbrains
      POSTGRES_USER: medbrains
      POSTGRES_PASSWORD: medbrains_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medbrains"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Headless-Chrome PDF rendering (document templating engine).
  gotenberg:
    image: gotenberg/gotenberg:8.21
    ports:
      - "127.0.0.1:3005:3000"
    command:
      - gotenberg
      - --api-timeout=30s
      - --chromium-restart-after=50
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kiwi TCMS (Test Case Management) ──
  kiwi_db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: kiwi
      MYSQL_DATABASE: kiwi
      MYSQL_USER: kiwi
      MYSQL_PASSWORD: kiwi
    volumes:
      - kiwi_dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  kiwi:
    image: kiwitcms/kiwi:latest
    ports:
      # Plain HTTP, bound to loopback: TLS for this host terminates at the
      # MedBrains proxy like every other dev domain, so the image's own HTTPS
      # listener on 8443 is not published. One certificate, one trust decision,
      # one place that knows which hostnames exist -- rather than a second
      # self-signed cert every developer has to click through.
      - "127.0.0.1:9080:8080"
    environment:
      KIWI_DB_HOST: kiwi_db
      KIWI_DB_PORT: "3306"
      KIWI_DB_NAME: kiwi
      KIWI_DB_USER: kiwi
      KIWI_DB_PASSWORD: kiwi
    depends_on:
      kiwi_db:
        condition: service_healthy
    volumes:
      - kiwi_uploads:/Kiwi/uploads
      # Kiwi hardcodes SECURE_SSL_REDIRECT and has no environment switch for
      # it, so the "don't enforce https" knob other images offer does not exist
      # here. This drop-in is imported as local settings and tells Django that
      # the proxy in front terminates TLS; without it Kiwi redirects `/` to `/`
      # for ever. See the file for why that is safe.
      - ./infra/local/kiwi-proxy-tls.py:/venv/lib64/python3.11/site-packages/tcms_settings_dir/zz_proxy_tls.py:ro
      # The image runs its own nginx that redirects 8080 to its own self-signed
      # HTTPS on 8443 -- a second proxy and a second certificate in front of the
      # one this project already has. Replaced with the same config minus that
      # redirect and minus the TLS server, so the only thing terminating TLS is
      # the MedBrains proxy.
      - ./infra/local/kiwi-nginx.conf:/Kiwi/etc/nginx.conf:ro

  # ── SpiceDB (ReBAC permissions service, Apache 2.0) ──
  # Shares the main `postgres` instance to avoid running two PG servers.
  # The `spicedb` database + role are created by `spicedb_db_init`
  # (idempotent — safe to re-run).
  spicedb_db_init:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: medbrains
      PGPASSWORD: medbrains_dev
    entrypoint: >
      sh -c "
        psql -tc \"SELECT 1 FROM pg_database WHERE datname='spicedb'\" | grep -q 1 ||
          psql -c \"CREATE DATABASE spicedb\";
        psql -tc \"SELECT 1 FROM pg_roles WHERE rolname='spicedb'\" | grep -q 1 ||
          psql -c \"CREATE ROLE spicedb LOGIN PASSWORD 'spicedb_dev'\";
        psql -c \"GRANT ALL PRIVILEGES ON DATABASE spicedb TO spicedb\";
        psql -d spicedb -c \"GRANT ALL ON SCHEMA public TO spicedb\";
      "
    restart: "no"

  spicedb_migrate:
    image: authzed/spicedb:v1.56.0
    command: >
      datastore migrate head
      --datastore-engine=postgres
      --datastore-conn-uri=postgres://spicedb:spicedb_dev@postgres:5432/spicedb?sslmode=disable
    depends_on:
      spicedb_db_init:
        condition: service_completed_successfully
    restart: "no"

  spicedb:
    image: authzed/spicedb:v1.56.0
    command: >
      serve
      --grpc-preshared-key=devsecret
      --datastore-engine=postgres
      --datastore-conn-uri=postgres://spicedb:spicedb_dev@postgres:5432/spicedb?sslmode=disable
      --metrics-addr=0.0.0.0:9090
    ports:
      - "50051:50051"   # gRPC
      - "8453:8443"     # HTTP gateway (8443 conflicts with another local service)
      - "9091:9090"     # Prometheus metrics
    depends_on:
      postgres:
        condition: service_healthy
      spicedb_migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Stalwart mail server (self-hosted, Rust) ──
  # Local transactional mail for dev — submission on 587 (matches the
  # seeded dev email config) + the management/JMAP API on 443 (mapped to
  # host 8086). The image `--init`s a random admin password on first boot;
  # the entrypoint below pins the fallback-admin secret to a known value
  # (STALWART_ADMIN_SECRET, default `medbrains_dev`) so the app's
  # domain-provisioning APIs can authenticate deterministically (admin /
  # that value). See RFCs/RFC-MAIL-STALWART.md.
  stalwart:
    image: stalwartlabs/stalwart:latest
    ports:
      - "127.0.0.1:587:587"     # SMTP submission (STARTTLS)
      - "127.0.0.1:465:465"     # SMTP submission (implicit SSL/TLS — "Use SSL" clients)
      - "127.0.0.1:993:993"     # IMAPS (staff mail clients)
      - "127.0.0.1:8086:443"    # admin web UI + JMAP + management API
    environment:
      STALWART_ADMIN_SECRET: ${STALWART_ADMIN_SECRET:-medbrains_dev}
    volumes:
      - stalwart_data:/opt/stalwart
      # System-trusted mkcert cert (covers mail.medbrains.localhost), generated
      # by `make local-https-cert`. Mounted read-only; the entrypoint wires it
      # in as the default TLS cert so Outlook/Apple Mail get a trusted chain
      # instead of Stalwart's on-the-fly self-signed cert. Absent = falls back
      # to self-signed (still works, just untrusted).
      - ./var/local-https:/opt/stalwart/certs:ro
    entrypoint:
      - /bin/sh
      - -c
      - >
        if [ ! -f /opt/stalwart/etc/config.toml ]; then /usr/local/bin/stalwart --init /opt/stalwart; fi;
        sed -i "/^\\[authentication.fallback-admin\\]/,/^\\[/ s|^secret = .*|secret = \"$$STALWART_ADMIN_SECRET\"|" /opt/stalwart/etc/config.toml;
        if [ -f /opt/stalwart/certs/medbrains.localhost.pem ] && ! grep -q "\\[certificate.default\\]" /opt/stalwart/etc/config.toml; then
          printf '\n[certificate.default]\ncert = "%%{file:/opt/stalwart/certs/medbrains.localhost.pem}%%"\nprivate-key = "%%{file:/opt/stalwart/certs/medbrains.localhost-key.pem}%%"\ndefault = true\n' >> /opt/stalwart/etc/config.toml;
        fi;
        exec /usr/local/bin/stalwart --config /opt/stalwart/etc/config.toml
    restart: unless-stopped

  # ── WHO ICD-API local terminology service ──
  # Optional for dev/research. Start with:
  #   make icd-up
  # or:
  #   ICD_API_ACCEPT_LICENSE=true docker compose --profile icd up -d icd-api
  icd-api:
    image: whoicd/icd-api:${ICD_API_IMAGE_TAG:-latest}
    profiles: ["icd"]
    ports:
      - "127.0.0.1:${ICD_API_PORT:-8382}:80"
    environment:
      include: ${ICD_API_INCLUDE:-2026-01_en}
      acceptLicense: ${ICD_API_ACCEPT_LICENSE:-false}
      saveAnalytics: ${ICD_API_SAVE_ANALYTICS:-false}
    restart: unless-stopped

  # ── Headscale — self-hosted VPN control plane (RFC-VPN-PLATFORM) ──
  # Opt-in (most hospitals run on LAN — leave it off). Start with:
  #   docker compose --profile vpn up -d headscale
  # MedBrains then mints per-device pre-auth keys via the Headscale API
  # (POST /api/vpn/enroll). The tailnet CIDR (prefixes.v4 below) goes into
  # tenants.allowed_ips so ip_restrict + Pingora admit VPN clients.
  headscale:
    image: headscale/headscale:0.23.0
    profiles: ["vpn"]
    ports:
      - "127.0.0.1:${HEADSCALE_PORT:-8080}:8080"   # coordination + HTTP API
    volumes:
      - headscale_data:/var/lib/headscale
      - ./deploy/headscale/config.yaml:/etc/headscale/config.yaml:ro
    command: serve
    restart: unless-stopped

volumes:
  pgdata:
  kiwi_dbdata:
  kiwi_uploads:
  stalwart_data:
  headscale_data:
