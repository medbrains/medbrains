services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: medbrains
      POSTGRES_USER: medbrains
      POSTGRES_PASSWORD: medbrains_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medbrains"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Headless-Chrome PDF rendering (document templating engine).
  gotenberg:
    image: gotenberg/gotenberg:8.21
    ports:
      - "127.0.0.1:3005:3000"
    command:
      - gotenberg
      - --api-timeout=30s
      - --chromium-restart-after=50
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kiwi TCMS (Test Case Management) ──
  kiwi_db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: kiwi
      MYSQL_DATABASE: kiwi
      MYSQL_USER: kiwi
      MYSQL_PASSWORD: kiwi
    volumes:
      - kiwi_dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  kiwi:
    image: kiwitcms/kiwi:latest
    ports:
      - "9443:8443"
    environment:
      KIWI_DB_HOST: kiwi_db
      KIWI_DB_PORT: "3306"
      KIWI_DB_NAME: kiwi
      KIWI_DB_USER: kiwi
      KIWI_DB_PASSWORD: kiwi
    depends_on:
      kiwi_db:
        condition: service_healthy
    volumes:
      - kiwi_uploads:/Kiwi/uploads

  # ── SpiceDB (ReBAC permissions service, Apache 2.0) ──
  # Shares the main `postgres` instance to avoid running two PG servers.
  # The `spicedb` database + role are created by `spicedb_db_init`
  # (idempotent — safe to re-run).
  spicedb_db_init:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: medbrains
      PGPASSWORD: medbrains_dev
    entrypoint: >
      sh -c "
        psql -tc \"SELECT 1 FROM pg_database WHERE datname='spicedb'\" | grep -q 1 ||
          psql -c \"CREATE DATABASE spicedb\";
        psql -tc \"SELECT 1 FROM pg_roles WHERE rolname='spicedb'\" | grep -q 1 ||
          psql -c \"CREATE ROLE spicedb LOGIN PASSWORD 'spicedb_dev'\";
        psql -c \"GRANT ALL PRIVILEGES ON DATABASE spicedb TO spicedb\";
        psql -d spicedb -c \"GRANT ALL ON SCHEMA public TO spicedb\";
      "
    restart: "no"

  spicedb_migrate:
    image: authzed/spicedb:v1.50.0
    command: >
      datastore migrate head
      --datastore-engine=postgres
      --datastore-conn-uri=postgres://spicedb:spicedb_dev@postgres:5432/spicedb?sslmode=disable
    depends_on:
      spicedb_db_init:
        condition: service_completed_successfully
    restart: "no"

  spicedb:
    image: authzed/spicedb:v1.50.0
    command: >
      serve
      --grpc-preshared-key=devsecret
      --datastore-engine=postgres
      --datastore-conn-uri=postgres://spicedb:spicedb_dev@postgres:5432/spicedb?sslmode=disable
      --metrics-addr=0.0.0.0:9090
    ports:
      - "50051:50051"   # gRPC
      - "8453:8443"     # HTTP gateway (8443 conflicts with another local service)
      - "9091:9090"     # Prometheus metrics
    depends_on:
      postgres:
        condition: service_healthy
      spicedb_migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── WHO ICD-API local terminology service ──
  # Optional for dev/research. Start with:
  #   make icd-up
  # or:
  #   ICD_API_ACCEPT_LICENSE=true docker compose --profile icd up -d icd-api
  icd-api:
    image: whoicd/icd-api:${ICD_API_IMAGE_TAG:-latest}
    profiles: ["icd"]
    ports:
      - "127.0.0.1:${ICD_API_PORT:-8382}:80"
    environment:
      include: ${ICD_API_INCLUDE:-2026-01_en}
      acceptLicense: ${ICD_API_ACCEPT_LICENSE:-false}
      saveAnalytics: ${ICD_API_SAVE_ANALYTICS:-false}
    restart: unless-stopped

volumes:
  pgdata:
  kiwi_dbdata:
  kiwi_uploads:
