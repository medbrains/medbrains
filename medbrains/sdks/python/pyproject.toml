[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medbrains-sdk"
version = "0.1.0"
description = "Build extensions for MedBrains, the open hospital OS: sign-in, typed calls, webhook verification and a local mock."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["medbrains_sdk"]
