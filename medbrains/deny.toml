# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Advisories and licences are judged on what ships: dev-dependencies (test
# harnesses, wiremock, goose) never reach a hospital.
exclude-dev = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Unmaintained crates fail only when we depend on them directly; transitive
# ones are reported by cargo-audit as warnings and tracked in the dep audit.
unmaintained = "workspace"
# Every entry says why it does not reach production and when it must be
# re-decided. scripts/check_audit_ignores.py fails CI once an expiry passes.
# cargo-audit reads this same list (security.yml), so there is one source.
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "zip 4 now only via tauri-plugin-updater 2.14 (latest), which extracts an update only after its signature verifies. Re-check on the next updater release. expires 2026-12-31" },
    { id = "RUSTSEC-2026-0368", reason = "zip 4 via tauri-plugin-updater only, after signature verification; see 0367. expires 2026-12-31" },
    { id = "RUSTSEC-2026-0369", reason = "zip 4 via tauri-plugin-updater only, after signature verification; see 0367. expires 2026-12-31" },
    { id = "RUSTSEC-2026-0119", reason = "hickory-proto 0.25 via iroh 0.92 only (server is on 0.26): quadratic name compression when encoding our own queries. Cleared by iroh 1.x. expires 2026-11-30" },
    { id = "RUSTSEC-2026-0253", reason = "lru 0.13/0.16 remain via iroh 0.92 and pingora 0.8 (offline-core is on 0.18): pop() panic-safety, no user callback runs inside pop. Cleared by iroh 1.x and pingora 0.9. expires 2026-12-31" },
    { id = "RUSTSEC-2026-0118", reason = "hickory-proto 0.25 (iroh): loop only with DNSSEC validation, which iroh does not enable. Cleared by iroh 1.x. expires 2026-11-30" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    "0BSD",
]
confidence-threshold = 0.8

# First-party crates are proprietary (LICENSE at the repo root) and carry
# `publish = false`; only third-party licences are judged.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Deny specific crates
deny = [
    # { name = "openssl" },  # Prefer rustls
    # RUSTSEC-2026-0384 (yanked): Interval races the timer thread on the
    # multi-thread runtime -> use-after-free. Fixed in 1.54.1.
    { name = "tokio", version = "=1.54.0" },
]

# Skip certain crates from duplicate detection
skip = [
    # { name = "syn", version = "1.0" },
]

skip-tree = [
    # { name = "windows-sys", version = "0.45" },
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = ["anthropics", "medbrains"]
