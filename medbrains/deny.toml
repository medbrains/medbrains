# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Advisories and licences are judged on what ships: dev-dependencies (test
# harnesses, wiremock, goose) never reach a hospital.
exclude-dev = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Unmaintained crates fail only when we depend on them directly; transitive
# ones are reported by cargo-audit as warnings and tracked in the dep audit.
unmaintained = "workspace"
# The ignores below are mostly transitive unmaintained or unsound crates that cargo-deny skips
# (scopes above) but cargo-audit and osv-scanner report, so cargo-deny never "encounters" them.
unused-ignored-advisory = "allow"
# Every entry says why it does not reach production and when it must be
# re-decided. scripts/check_audit_ignores.py fails CI once an expiry passes.
# cargo-audit reads this same list (security.yml), so there is one source.
ignore = [
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill unmaintained; via heapless 0.7 <- postcard 1.1.3 (latest) <- iroh-relay, loro. Only compiled for targets without native atomics; no release of postcard drops it; expires 2027-02-15" },
    { id = "RUSTSEC-2026-0374", reason = "basic-toml unmaintained; build-time only, via askama_derive 0.16.1 <- uniffi_bindgen 0.32.2 (both latest), reads our own binding templates; expires 2027-02-15" },
    { id = "RUSTSEC-2026-0247", reason = "bitmaps unmaintained; via im/sized-chunks <- loro-internal 1.17.1 (latest), edge CRDT sync. Re-decide when loro moves to imbl; expires 2027-02-15" },
    { id = "RUSTSEC-2026-0248", reason = "im unmaintained; via loro-internal 1.17.1 (latest), edge CRDT sync. Re-decide when loro moves to imbl; expires 2027-02-15" },
    { id = "RUSTSEC-2023-0126", reason = "im OrdSet aliasing unsoundness, no fixed im release; via loro-internal 1.17.1 (latest). Re-decide when loro moves to imbl; expires 2027-02-15" },
    { id = "RUSTSEC-2026-0251", reason = "sized-chunks unmaintained; via im <- loro-internal 1.17.1 (latest). Re-decide when loro moves to imbl; expires 2027-02-15" },
    { id = "RUSTSEC-2026-0255", reason = "sized-chunks panic-in-Drop unsoundness, no fixed release; needs an element whose Drop panics, via im <- loro-internal 1.17.1 (latest). Re-decide when loro moves to imbl; expires 2027-02-15" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; proc macro, compile time only, via netlink-packet-core 0.8 <- netwatch 0.19 <- iroh 1.4.1 (latest pins netwatch ^0.19; 0.20 drops paste); expires 2027-02-15" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained; proc macro, compile time only, via glib-macros/gtk3-macros 0.18 <- tauri 2 Linux desktop shell; expires 2027-02-15" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained, no flaw (thin wrapper over rustls-pki-types); via pingora-rustls 0.9.1 (latest) <- medbrains-proxy; expires 2027-02-15" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained; via serde_yaml <- pingora-core 0.9.1 (latest), parses only the proxy's own operator-written config; expires 2027-02-15" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained (merged into zbus 6), no flaw; via zbus 5 <- notify-rust, tauri-plugin-notification/single-instance (Linux desktop); expires 2027-02-15" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained (merged into zbus 6), no flaw; via zbus 5 <- notify-rust, tauri-plugin-notification/single-instance (Linux desktop); expires 2027-02-15" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained (merged into zbus 6), no flaw; via zbus 5 <- notify-rust, tauri-plugin-notification/single-instance (Linux desktop); expires 2027-02-15" },
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 VariantStrIter unsoundness, fixed in 0.20; tauri 2 / webkit2gtk still require gtk-rs 0.18 (Linux desktop only), our code never iterates a GVariant; expires 2027-02-15" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    "0BSD",
]
confidence-threshold = 0.8

# First-party crates are proprietary (LICENSE at the repo root) and carry
# `publish = false`; only third-party licences are judged.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Deny specific crates
deny = [
    # { name = "openssl" },  # Prefer rustls
    # RUSTSEC-2026-0384 (yanked): Interval races the timer thread on the
    # multi-thread runtime -> use-after-free. Fixed in 1.54.1.
    { name = "tokio", version = "=1.54.0" },
    # Unofficial single-maintainer SpiceDB client. The authz path uses
    # medbrains-spicedb-proto, generated from the official authzed/api protos.
    { name = "spicedb-rs-client" },
    { name = "spicedb-rs-proto" },
]

# Skip certain crates from duplicate detection
skip = [
    # { name = "syn", version = "1.0" },
]

skip-tree = [
    # { name = "windows-sys", version = "0.45" },
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = ["anthropics", "medbrains"]
