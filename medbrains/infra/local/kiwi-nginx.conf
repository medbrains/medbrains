# MedBrains: Kiwi TCMS served as plain HTTP, with no TLS of its own.
#
# Generated from the image's own /Kiwi/etc/nginx.conf, with two changes:
#
#   1. The 8080 server no longer answers `return 301 https://$host$request_uri`.
#      It serves the application, because TLS for this hostname is terminated by
#      the MedBrains proxy in front and there is nothing to upgrade to.
#   2. The 8443 TLS server is gone, along with its self-signed
#      /Kiwi/ssl/localhost.crt. One certificate for the whole dev environment,
#      issued by the local CA the machine already trusts, instead of a second
#      one every developer has to click past.
#
# Everything else -- the socket, the static and upload locations, the rate
# limit, the CSP header -- is the image's, unchanged. Keep it that way: this
# file exists to remove a layer, not to reimplement one.
# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/

daemon on;
worker_processes auto;
error_log /dev/stderr;
pid /tmp/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /dev/stdout  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    gzip on;
    gzip_disable "msie6";

    # note: this should be bigger than
    # FILE_UPLOAD_MAX_SIZE from Kiwi TCMS which defaults to 5M.
    client_max_body_size 10m;

    # limit URI size, see
    # https://github.com/kiwitcms/Kiwi/issues/1054
    large_client_header_buffers 4 10k;



    # default proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    map $request_uri $limit_key {
        default "";
        ~^/accounts/ $binary_remote_addr;
    }
    limit_req_zone $limit_key zone=ten-per-sec:10m rate=10r/s;
    limit_req_status 429;

    upstream kiwitcms {
        server unix:///tmp/kiwitcms.sock;
    }

    # WARNING: make sure these match tcms.core.middleware.ExtraHeadersMiddleware
    add_header Content-Security-Policy "script-src 'self' cdn.crowdin.com *.ethicalads.io plausible.io;";

    server {
        listen       8080;
        listen       [::]:8080;
        server_name  _;

        location = /favicon.ico {
            alias /Kiwi/static/images/favicon.ico;
        }

        location = /robots.txt {
            alias /Kiwi/static/robots.txt;
        }

        location /uploads/  {
            # prevent browser from possibly interpreting untrusted files
            types        { }
            default_type text/plain;

            alias /Kiwi/uploads/;
        }

        location /static/ {
            alias /Kiwi/static/;
        }

        location / {
            include     /etc/nginx/uwsgi_params;
            uwsgi_pass  kiwitcms;

            limit_req zone=ten-per-sec burst=20 nodelay;
        }
    }
}
