# MedBrains local HTTPS proxy.
#
# Binds UNPRIVILEGED ports; pf (installed once via
# `make dev-pf-setup`, see scripts/dev_pf_setup.sh) redirects the world's
# connections from 80 -> 8080 and 443 -> 8443 on loopback so dev URLs stay
# https://medbrains.localhost without ever running the proxy as root.
#
# Local browser/simulator URLs:
#   https://medbrains.localhost
#   https://medbrains-desktop.localhost
#   https://medbrains-simulator.localhost
#   https://medbrains-icd.localhost
#
# Upstreams:
#   /api/* -> Rust backend on 3000
#   /ws*   -> edge sync hub on 7811
#   /*     -> Vite web UI on 5173
#   medbrains-simulator.localhost -> Simulator Vite UI on 5180
#   medbrains-icd.localhost -> WHO ICD-API on 8382

http_port = 8080
https_port = 8443
body_limit_bytes = 26214400
block_source_maps = false
content_security_policy = """
default-src 'self';
base-uri 'self';
object-src 'none';
frame-ancestors 'self';
script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval';
script-src-elem 'self' 'unsafe-inline';
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com;
img-src 'self' data: blob: https:;
font-src 'self' data: https://fonts.gstatic.com;
connect-src 'self' https: ws: wss:;
worker-src 'self' blob:;
frame-src 'self';
form-action 'self';
upgrade-insecure-requests
"""
downstream_read_timeout_ms = 30000
downstream_write_timeout_ms = 30000
upstream_connect_timeout_ms = 5000
upstream_total_timeout_ms = 15000
upstream_read_timeout_ms = 60000
upstream_idle_timeout_ms = 60000
drain_timeout_ms = 1000

[[edge_policies]]
prefix = "/api/sync/"
class = "outbox"
upstream = "127.0.0.1:3000"
body_limit_bytes = 52428800
upstream_total_timeout_ms = 120000
upstream_read_timeout_ms = 120000
require_idempotency_key = true
retry_after_seconds = 10
cache_control = "no-store"
allowed_methods = ["GET", "POST", "PUT", "PATCH", "OPTIONS"]

[[edge_policies]]
prefix = "/api/outbox/"
class = "outbox"
upstream = "127.0.0.1:3000"
body_limit_bytes = 52428800
upstream_total_timeout_ms = 120000
upstream_read_timeout_ms = 120000
require_idempotency_key = true
retry_after_seconds = 10
cache_control = "no-store"
allowed_methods = ["GET", "POST", "PUT", "PATCH", "OPTIONS"]

[[edge_policies]]
prefix = "/api/client-errors"
class = "telemetry"
upstream = "127.0.0.1:3000"
body_limit_bytes = 2097152
upstream_total_timeout_ms = 15000
upstream_read_timeout_ms = 30000
retry_after_seconds = 30
cache_control = "no-store"
allowed_methods = ["POST", "OPTIONS"]

[[edge_policies]]
prefix = "/api/"
class = "api"
upstream = "127.0.0.1:3000"
body_limit_bytes = 26214400
upstream_total_timeout_ms = 15000
upstream_read_timeout_ms = 60000
retry_after_seconds = 5
cache_control = "no-store"
allowed_methods = ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]

# Matching is first-match-wins, so these two sit above the catch-all /ws below.
#
# The backend serves /ws/notifications, /ws/queue and /ws/queue/{department}
# on 3000 — they are ordinary app websockets, nothing to do with device sync.
# A single /ws -> 7811 rule sent them all to the edge hub, which does not even
# route by path, so notifications failed with a 503 whenever no edge appliance
# was running. On a dev machine that is always.
[[edge_policies]]
prefix = "/api/ws/notifications"
class = "websocket"
upstream = "127.0.0.1:3000"
body_limit_bytes = 1048576
upstream_total_timeout_ms = 3600000
upstream_read_timeout_ms = 3600000
retry_after_seconds = 5
cache_control = "no-store"
allowed_methods = ["GET", "OPTIONS"]

[[edge_policies]]
prefix = "/ws/queue"
class = "websocket"
upstream = "127.0.0.1:3000"
body_limit_bytes = 1048576
upstream_total_timeout_ms = 3600000
upstream_read_timeout_ms = 3600000
retry_after_seconds = 5
cache_control = "no-store"
allowed_methods = ["GET", "OPTIONS"]

# Everything else under /ws is device sync, which the edge appliance serves.
[[edge_policies]]
prefix = "/ws"
class = "websocket"
upstream = "127.0.0.1:7811"
body_limit_bytes = 1048576
upstream_total_timeout_ms = 3600000
upstream_read_timeout_ms = 3600000
retry_after_seconds = 5
cache_control = "no-store"
allowed_methods = ["GET", "OPTIONS"]

[[edge_policies]]
prefix = "/vite-hmr"
class = "websocket"
upstream = "127.0.0.1:5173"
body_limit_bytes = 1048576
upstream_total_timeout_ms = 3600000
upstream_read_timeout_ms = 3600000
retry_after_seconds = 5
cache_control = "no-store"
allowed_methods = ["GET", "OPTIONS"]

[[edge_policies]]
prefix = "/simulator-vite-hmr"
class = "websocket"
upstream = "127.0.0.1:5180"
body_limit_bytes = 1048576
upstream_total_timeout_ms = 3600000
upstream_read_timeout_ms = 3600000
retry_after_seconds = 5
cache_control = "no-store"
allowed_methods = ["GET", "OPTIONS"]

[[edge_policies]]
prefix = "/assets/"
class = "assets"
body_limit_bytes = 1048576
upstream_total_timeout_ms = 10000
upstream_read_timeout_ms = 30000
cache_control = "public, max-age=31536000, immutable"
allowed_methods = ["GET", "HEAD", "OPTIONS"]

[[edge_policies]]
prefix = "/"
class = "spa"
body_limit_bytes = 1048576
upstream_total_timeout_ms = 15000
upstream_read_timeout_ms = 30000
retry_after_seconds = 5
cache_control = "no-store"
allowed_methods = ["GET", "HEAD", "OPTIONS"]

[[routes]]
domain = "medbrains.localhost"
upstream = "127.0.0.1:5173"
cert_path = "var/local-https/medbrains.localhost.pem"
key_path = "var/local-https/medbrains.localhost-key.pem"

[[routes]]
domain = "medbrains-desktop.localhost"
upstream = "127.0.0.1:5173"
cert_path = "var/local-https/medbrains.localhost.pem"
key_path = "var/local-https/medbrains.localhost-key.pem"

[[routes]]
domain = "medbrains-simulator.localhost"
upstream = "127.0.0.1:5180"
cert_path = "var/local-https/medbrains.localhost.pem"
key_path = "var/local-https/medbrains.localhost-key.pem"
cors_allowed_origins = [
  "https://medbrains.localhost",
]

[[routes]]
# Kiwi TCMS. Published on loopback as plain HTTP by docker-compose; TLS is
# terminated here so the test-management console shares the one dev
# certificate rather than shipping a self-signed one of its own.
domain = "medbrains-kiwi.localhost"
upstream = "127.0.0.1:9080"
cert_path = "var/local-https/medbrains.localhost.pem"
key_path = "var/local-https/medbrains.localhost-key.pem"
cors_allowed_origins = [
  "https://medbrains.localhost",
]

[[routes]]
domain = "medbrains-icd.localhost"
upstream = "127.0.0.1:8382"
cert_path = "var/local-https/medbrains.localhost.pem"
key_path = "var/local-https/medbrains.localhost-key.pem"
cors_allowed_origins = [
  "https://medbrains.localhost",
  "https://medbrains-desktop.localhost",
  "https://medbrains-simulator.localhost",
]
