[package]
name = "medbrains-desktop"
publish = false
version.workspace = true
description = "MedBrains desktop client for Windows and Mac PCs"
authors = ["MedBrains"]
edition = "2024"
rust-version.workspace = true

# Tauri's build script generates the binary. The shell crate has no
# library target — only the bin defined below.
[[bin]]
name = "medbrains-desktop"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [
    "tray-icon",
    "image-png",
] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.7.0"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-single-instance = "2.5.4"
# Remembers the hospital server this desktop opens.
tauri-plugin-store = "2.5.0"

base64 = { workspace = true }
# Checks a hospital server answers before the window is sent to it.
reqwest = { workspace = true }
# Crash reports from this shell, through the hospital server's tunnel. Same SDK
# and version as medbrains-error-tracking; off unless the server turns it on.
sentry = { version = "0.49.3", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
