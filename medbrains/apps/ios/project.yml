name: MedBrains
options:
  bundleIdPrefix: com.medbrains
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
settings:
  configs:
    Release:
      # Shipped binaries carry no symbol names to read the app back from; the
      # dSYM stays with us to symbolicate crash reports.
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      STRIP_SWIFT_SYMBOLS: YES
      COPY_PHASE_STRIP: YES
packages:
  MedBrainsCore:
    path: Packages/MedBrainsCore
  MedBrainsKit:
    path: Packages/MedBrainsKit
  MedBrainsUI:
    path: Packages/MedBrainsUI
  MedBrainsOffline:
    path: Packages/MedBrainsOffline
targets:
  MedBrainsStaff:
    type: application
    platform: iOS
    sources:
      - path: MedBrainsStaff
      # Shared with the web picker: one list of body regions for every surface.
      - path: ../../packages/anatomy/body-regions.json
        buildPhase: resources
      # Alert sounds, shared with web and Android (packages/alert-sounds/NOTICE.md).
      - path: ../../packages/alert-sounds/ios/alert_calm.wav
        buildPhase: resources
      - path: ../../packages/alert-sounds/ios/alert_attention.wav
        buildPhase: resources
      - path: ../../packages/alert-sounds/ios/alert_urgent.wav
        buildPhase: resources
    dependencies:
      - package: MedBrainsCore
      - package: MedBrainsKit
      - package: MedBrainsUI
      - package: MedBrainsOffline
    info:
      path: MedBrainsStaff/Resources/Info.plist
      properties:
        CFBundleDisplayName: MedBrains Staff
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Scan wristbands, drug barcodes and sample labels.
        NSFaceIDUsageDescription: Unlock MedBrains with Face ID.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.medbrains.staff
        SWIFT_VERSION: "5.10"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
  MedBrainsPatient:
    type: application
    platform: iOS
    sources:
      - path: MedBrainsPatient
      # Shared with the web: one DPDP privacy notice for every surface.
      - path: ../../packages/privacy/dpdp-notice.json
        buildPhase: resources
      # Patients only ever hear calm, so it is the only sound bundled.
      - path: ../../packages/alert-sounds/ios/alert_calm.wav
        buildPhase: resources
    dependencies:
      - package: MedBrainsCore
      - package: MedBrainsKit
      - package: MedBrainsUI
    info:
      path: MedBrainsPatient/Resources/Info.plist
      properties:
        CFBundleDisplayName: MedBrains
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSFaceIDUsageDescription: Unlock MedBrains with Face ID.
        # Read only: the app never writes to Apple Health.
        NSHealthShareUsageDescription: MedBrains reads the readings you choose to share — blood pressure, glucose, weight, oxygen and heart rate — so your care team can see them.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: MedBrainsPatient/Resources/MedBrainsPatient.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.medbrains.patient
        SWIFT_VERSION: "5.10"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
  MedBrainsPatientUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MedBrainsPatientUITests
    dependencies:
      - target: MedBrainsPatient
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
  MedBrainsStaffUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MedBrainsStaffUITests
    dependencies:
      - target: MedBrainsStaff
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
schemes:
  MedBrainsPatient:
    build:
      targets:
        MedBrainsPatient: all
        MedBrainsPatientUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MedBrainsPatientUITests
  MedBrainsStaff:
    build:
      targets:
        MedBrainsStaff: all
        MedBrainsStaffUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MedBrainsStaffUITests
