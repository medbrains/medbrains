# The deciding test for the identity provider: real WebAuthn registrations against a booted image,
# from software authenticators that present real attestation. Outside the workspace: it needs
# Kanidm's own client at the release the image ships, and the server must never link it.
[package]
name = "kanidm-softkey"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
kanidm_client = { git = "https://github.com/kanidm/kanidm", rev = "a52b723ce8efb1f4d0a6bc2a2c36b4071f95317d" }
kanidm_proto = { git = "https://github.com/kanidm/kanidm", rev = "a52b723ce8efb1f4d0a6bc2a2c36b4071f95317d" }
serde_json = "1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
webauthn-authenticator-rs = { version = "=0.6.2", default-features = false, features = ["softpasskey", "softtoken"] }
webauthn-rs = { version = "=0.6.2", features = ["preview-features"] }
