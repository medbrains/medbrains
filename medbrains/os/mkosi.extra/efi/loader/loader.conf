# No boot menu and no editor: an edited kernel command line would run with the disk open (OS-KEYS.md).
timeout menu-disabled
editor no
# Secure Boot keys (OS-KEYS.md): enrolled from /loader/keys/auto only where systemd-boot judges it safe, a
# virtual machine in setup mode. A real machine gets them at installation, never by surprise.
secure-boot-enroll if-safe
