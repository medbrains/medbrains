# SEC5 hardening for the database. Data and config live on the data partition.
[Service]
# Debian's unit starts as root and setuid()s down; with no capabilities that
# fails. Start as the owner, which pg_ctlcluster also supports.
User=postgres
Group=postgres
ProtectSystem=strict
ReadWritePaths=/var/lib/postgresql /var/log/postgresql /run/postgresql /var/backups/medbrains
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
NoNewPrivileges=yes
CapabilityBoundingSet=
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
# The database talks to this machine only (N1), whatever the firewall does.
IPAddressDeny=any
IPAddressAllow=localhost
