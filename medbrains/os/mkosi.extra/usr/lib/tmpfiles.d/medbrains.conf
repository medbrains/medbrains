# Writable state lives only on the data partition (/var).
d /var/lib/medbrains                0750 medbrains medbrains -
d /var/lib/medbrains/config         0750 root      medbrains -
d /var/lib/kanidm                   0750 kanidm    kanidm    -
d /var/lib/kanidm/backups           0750 kanidm    kanidm    -
d /var/lib/medbrains/network        0750 root      root      -
d /var/lib/medbrains/objects        0750 medbrains medbrains -
d /var/lib/medbrains/cold           0750 medbrains medbrains -
d /var/lib/medbrains/archive        0750 medbrains medbrains -
d /var/log/medbrains                0750 medbrains medbrains -
d /var/backups/medbrains            0750 postgres  postgres  -
d /var/lib/postgresql               0755 postgres  postgres  -
d /var/lib/postgresql/conf          0755 postgres  postgres  -
d /var/log/postgresql               1775 root      postgres  -
d /var/lib/medbrains-settings       0755 root      root      -
L /var/lib/medbrains-settings/localtime - - - - /usr/share/zoneinfo/Asia/Kolkata
d /var/lib/kiosk                    0750 kiosk     kiosk     -
# The screen's one trusted certificate: empty until this machine has a front end to trust. Root's,
# so the screen's user can't add to what it trusts.
f /var/lib/medbrains-settings/local-front.pem 0644 root root -
d /var/lib/medbrains-agent          0750 medbrains-agent kiosk -
d /run/medbrains-console            0750 root      kiosk     -
d /run/systemd/network              0755 root      root      -
d /run/medbrains-role               0755 root      root      -
# Saved Wi-Fi passwords: root only, on the data partition.
d /var/lib/iwd                      0700 root      root      -
