# What medbrains-front serves. Certificates and the names file come from front-certs.
#
# A site's connection uses two open files, one for the client and one for the back end. The front
# refuses to start if these limits need more than LimitNOFILE in its unit allows.

names_file = "/var/lib/medbrains-front/lan/names"

# Plain HTTP only ever redirects.
[[redirect_listen]]
addr = "[::]:80"
max_connections = 256
max_per_address = 32

[[sites]]
name = "medbrains"
upstream = "127.0.0.1:3000"
error_page = "MedBrains is not answering. Try again in a moment; if it stays like this, call your system administrator."

# The LAN: IPv4 and IPv6 together. The limit per address stops accidents, not attackers: a PC can
# claim more addresses, so the total and the loopback port's own limit are what hold. An IPv6 /64 is
# one address here, often a whole ward's VLAN, and a terminal server is one address for all its
# users, so it is set high enough for either.
[[sites.listen]]
addr = "[::]:443"
cert = "/var/lib/medbrains-front/lan/chain.pem"
key = "/var/lib/medbrains-front/lan/key.pem"
max_per_address = 1024

# The machine's own screen, and tunnels from nodes. Loopback only, with its own limit, so a flood
# on the LAN port leaves it free. No limit per address, because all of it arrives from loopback.
[[sites.listen]]
addr = "127.0.0.1:8443"
cert = "/var/lib/medbrains-front/screen/cert.pem"
key = "/var/lib/medbrains-front/screen/key.pem"
max_connections = 1024
max_per_address = 0

# The identity provider (Kanidm). A name of its own, not medbrains.local, because Kanidm's session cookies go
# to its whole domain and a browser sends cookies to every port of a name. Kanidm itself listens on loopback
# only, over TLS, and the front trusts that one certificate.
[[sites]]
name = "identity"
upstream = "127.0.0.1:8444"
upstream_tls = { ca = "/var/lib/medbrains-front/idp/kanidm-back.pem", server_name = "idm.medbrains.local" }
error_page = "Sign-in is not answering. Try again in a moment; if it stays like this, call your system administrator."
only_hosts = ["idm.medbrains.local"]
# SCIM has crashed Kanidm twice through its filter parser and we do not use it. The landing page is upstream
# sign-in, which has no setting to turn off; RADIUS is unused too.
block_paths = ["/docs", "/metrics", "/scim/", "/ui/login/oauth2_landing", "/ui/radius"]
# Every path that can carry a guess: one address, 30 at once, regaining 15 a minute. Kanidm's own wait after a
# wrong password still applies behind this. The screen is one address here, 127.0.0.1.
limits = [
    { path = "/ui/login/begin", burst = 30, per_minute = 15 },
    { path = "/ui/login/pw", burst = 30, per_minute = 15 },
    { path = "/ui/login/totp", burst = 30, per_minute = 15 },
    { path = "/ui/login/backup_code", burst = 30, per_minute = 15 },
    { path = "/ui/reauth", burst = 30, per_minute = 15 },
    { path = "/v1/auth", burst = 30, per_minute = 15 },
    { path = "/v1/reauth", burst = 30, per_minute = 15 },
]

[[sites.listen]]
# Sign-in pages only, so a small share of the front's open files: LimitNOFILE in its unit holds them all.
addr = "[::]:9443"
cert = "/var/lib/medbrains-front/idp/cert.pem"
key = "/var/lib/medbrains-front/idp/key.pem"
max_connections = 128
max_per_address = 64
