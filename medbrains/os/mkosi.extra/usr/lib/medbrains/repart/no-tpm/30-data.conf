# Data on a machine with no TPM, only after someone typed that choice at setup (disk-setup). LUKS with
# an empty key is the same layout as the sealed disk and protects nothing: anybody can open it. Keeping
# one layout means the boot path does not fork, and a TPM fitted later can be enrolled in place.
[Partition]
Type=var
Label=medbrains-data
Format=ext4
CopyFiles=/var:/
Encrypt=key-file
