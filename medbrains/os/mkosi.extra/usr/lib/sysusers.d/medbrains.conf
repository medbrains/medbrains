# Service users (architecture §7). No logins, no homes outside the data partition.
# Fixed numbers: the data disk keeps these across updates, and a number that moved would hand files to
# the wrong service. The updater refuses a new system whose numbers differ (OS-UPDATES.md).
u medbrains 990 "MedBrains server" /var/lib/medbrains /usr/sbin/nologin
u kanidm    988 "MedBrains identity provider" /var/lib/kanidm /usr/sbin/nologin
u medbrains-front 987 "MedBrains TLS front" /var/lib/medbrains-front /usr/sbin/nologin
u kiosk     989 "MedBrains appliance screen" /var/lib/kiosk /usr/sbin/nologin
u medbrains-agent 986 "MedBrains agent" /var/lib/medbrains-agent /usr/sbin/nologin
m kiosk video
m kiosk render
m kiosk input
# May use io_uring: see sysctl.d/90-medbrains.conf.
g medbrains-uring 977
