# Service users (architecture §7). No logins, no homes outside the data partition.
u medbrains - "MedBrains server" /var/lib/medbrains /usr/sbin/nologin
u kanidm    - "MedBrains identity provider" /var/lib/kanidm /usr/sbin/nologin
u medbrains-front - "MedBrains TLS front" /var/lib/medbrains-front /usr/sbin/nologin
u kiosk     - "MedBrains appliance screen" /var/lib/kiosk /usr/sbin/nologin
u medbrains-agent - "MedBrains agent" /var/lib/medbrains-agent /usr/sbin/nologin
m kiosk video
m kiosk render
m kiosk input
# May use io_uring: see sysctl.d/90-medbrains.conf.
g medbrains-uring 977
