# Authenticated time (RFC-HOSPITAL-OS §8q, N1): clinical records depend on the clock.
server time.cloudflare.com iburst nts
server ptbtime2.ptb.de iburst nts
server ptbtime1.ptb.de iburst nts

# A box with no battery-backed clock starts with a wrong date, which would fail the first certificate
# check. Only the first time update skips that date check.
nocerttimecheck 1
ntsdumpdir /var/lib/chrony
driftfile /var/lib/chrony/chrony.drift
makestep 1 3
rtcsync

# A main machine serves the hospital network, and keeps serving it when the internet is gone. Its
# `allow` lines come from role-network, so a node opens no time port.
confdir /run/medbrains-role
local stratum 10 orphan
