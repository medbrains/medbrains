# Harden Linux with settings it already has (task T1.1), taken from Kicksecure's security-misc and the
# CIS Debian benchmark where they fit an appliance. A key prefixed with - may be missing on one
# architecture without failing the boot. What we left out, and why, is in os/README.md "Linux hardening".
# Unprivileged user namespaces stay on because WebKit's sandbox (bubblewrap) needs them; turning them
# off removes a bigger wall.

# Kernel addresses are hidden from everyone, root included, so an exploit cannot aim at them.
kernel.kptr_restrict = 2
# Kernel messages, which leak addresses and device details, are for root only.
kernel.dmesg_restrict = 1
# No performance counters for anyone but root: they have been a steady source of kernel flaws.
kernel.perf_event_paranoid = 3
# BPF programs only from root, and the JIT hardened against spraying.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
# No booting another kernel from this one: it would skip the measured, signed boot.
kernel.kexec_load_disabled = 1
# Only a process with CAP_SYS_PTRACE may trace another, so a compromised service cannot read the server.
kernel.yama.ptrace_scope = 2
# No magic SysRq keys from a keyboard at the screen.
kernel.sysrq = 0
# userfaultfd only for root: it is used to win kernel race conditions.
vm.unprivileged_userfaultfd = 0
# No line discipline loads because a program asked for it.
dev.tty.ldisc_autoload = 0
# No program may push keystrokes into a terminal it does not own.
dev.tty.legacy_tiocsti = 0
# Full address space randomisation, and nothing mapped at the bottom where a NULL pointer lands.
kernel.randomize_va_space = 2
vm.mmap_min_addr = 65536
# More random bits for where libraries and the heap are placed; each architecture caps its own maximum.
-vm.mmap_rnd_bits = 32
-vm.mmap_rnd_compat_bits = 16
# A crashing program leaves no core file: it could hold patient data, written in the clear.
kernel.core_pattern = |/bin/false
fs.suid_dumpable = 0
# Links, FIFOs and files in shared sticky folders cannot be used to trick a privileged program.
fs.protected_fifos = 2
fs.protected_regular = 2
fs.protected_hardlinks = 1
fs.protected_symlinks = 1

# Network: this machine is an end host, never a router.
# SYN floods are answered with cookies instead of filling the queue.
net.ipv4.tcp_syncookies = 1
# A stray RST cannot cut a connection in TIME-WAIT (RFC 1337).
net.ipv4.tcp_rfc1337 = 1
# Packets whose source could not have come in on that interface are dropped.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# Nobody on the LAN can re-route this machine's traffic with an ICMP redirect.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
# Nor does it send redirects: it routes nothing.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0
# A sender cannot choose the path its packets take through this machine.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
# The kernel takes no router advertisements itself; systemd-networkd handles them, by its own rules.
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0
# Impossible source addresses are logged, so a spoofing attempt leaves a trace.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
# No answer to broadcast pings (smurf amplification) or to bogus ICMP errors.
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
# ARP answers only for addresses on the interface asked, so the machine does not leak its other networks.
# Not Kicksecure's arp_ignore=2: it ignores probes sent from 0.0.0.0, so another device could take this
# machine's address without the conflict being seen.
net.ipv4.conf.all.arp_filter = 1
net.ipv4.conf.all.arp_ignore = 1

# Tuning for zram (D4.2). Swapping to compressed memory is much cheaper than dropping file
# pages and reading them back, so prefer it. Read one page at a time: there is no disk seek
# for read-ahead to save.
vm.swappiness = 180
vm.page-cluster = 0
# io_uring has been a frequent source of kernel flaws, so only services in this group may use it.
# 977 is medbrains-uring in sysusers.d. Add a service to the group only where it measurably helps.
kernel.io_uring_disabled = 1
kernel.io_uring_group = 977
