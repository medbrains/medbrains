<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- MedBrains Sans draws Latin only. For Indian scripts the screen falls back to the Noto faces
     installed beside it (crates/medbrains-shell/fonts, built by tools/fonts/build_medbrains_sans.py),
     which pair with it at the same size. -->
<fontconfig>
  <alias binding="same">
    <family>MedBrains Sans</family>
    <prefer>
      <family>MedBrains Sans</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Sans Tamil</family>
    </prefer>
  </alias>
</fontconfig>
