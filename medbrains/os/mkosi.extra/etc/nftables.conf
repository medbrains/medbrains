#!/usr/sbin/nft -f
# Default deny, both directions (RFC-HOSPITAL-OS §8q, N1). Only what is listed here crosses the network.
#
# ponytail: outbound 443 is open to any address until Control can hold an allowlist (N3), and devices
# such as analysers and PACS have no outbound path until the device network gateway (N4).
flush ruleset

table inet medbrains {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state invalid drop
        ct state established,related accept
        iif lo accept

        # The address and the neighbours: without these the machine falls off the network.
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
        ip6 nexthdr icmpv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, echo-request, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept

        udp dport 5353 accept comment "medbrains.local"
        udp dport 123 accept comment "serves the LAN its time"

        # One address gets a limited number of connections, so one machine cannot exhaust the front end.
        tcp dport { 80, 443, 9443 } ct state new meter web_new { ip saddr limit rate over 50/second burst 100 packets } drop
        tcp dport { 80, 443, 9443 } ct state new meter web_new6 { ip6 saddr limit rate over 50/second burst 100 packets } drop
        tcp dport { 80, 443 } accept
        tcp dport 9443 accept comment "identity provider console and sign-in"

        limit rate 5/minute log prefix "medbrains-drop-in: " level info
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy drop;

        ct state invalid drop
        ct state established,related accept
        oif lo accept

        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept
        udp dport { 67, 547 } accept comment "address"
        meta l4proto { tcp, udp } th dport 53 accept comment "names"
        udp dport 5353 accept comment "medbrains.local"
        udp dport 123 accept comment "time"
        tcp dport 4460 accept comment "authenticated time (NTS)"
        tcp dport 443 accept comment "updates and services the hospital turned on"

        limit rate 5/minute log prefix "medbrains-drop-out: " level info
    }
}
