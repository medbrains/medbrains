# Kernel code a hospital machine has no use for cannot load, so its flaws cannot be reached
# (task T1.1). Linux loads many of these on demand when any program asks for them, so each is
# replaced by /bin/false: modprobe fails, and the attempt shows in the journal. The list follows
# Kicksecure's security-misc and CIS Debian 1.1.1 and 3.2; what we kept, and why, is in os/README.md.

# Rare network protocols: reachable by any program that opens a socket, and each has had remote or local flaws.
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install rds_tcp /bin/false
install rds_rdma /bin/false
install tipc /bin/false
install ax25 /bin/false
install netrom /bin/false
install rose /bin/false
install x25 /bin/false
install hamradio /bin/false
install ipx /bin/false
install appletalk /bin/false
install psnap /bin/false
install p8022 /bin/false
install p8023 /bin/false
install decnet /bin/false
install econet /bin/false
install atm /bin/false
install n-hdlc /bin/false
install af_802154 /bin/false
# CAN bus: for cars and factories, not hospital networks.
install can /bin/false
install can-raw /bin/false
install can-bcm /bin/false
install can-gw /bin/false
install can-isotp /bin/false
install can-j1939 /bin/false
install vcan /bin/false
install slcan /bin/false

# File systems nothing here mounts. A USB stick formatted with one of these would reach its parser.
install cramfs /bin/false
install squashfs /bin/false
install freevxfs /bin/false
install jffs2 /bin/false
install hfs /bin/false
install hfsplus /bin/false
install udf /bin/false
install adfs /bin/false
install affs /bin/false
install befs /bin/false
install jfs /bin/false
install minix /bin/false
install nilfs2 /bin/false
install ocfs2 /bin/false
install gfs2 /bin/false
install orangefs /bin/false
install reiserfs /bin/false
install romfs /bin/false
install sysv /bin/false
install ufs /bin/false
install ubifs /bin/false
install zonefs /bin/false
install ecryptfs /bin/false
# Network file systems and servers: backups go out over HTTPS, and no share is mounted or served.
install ksmbd /bin/false
install cifs /bin/false
install nfs /bin/false
install nfsv3 /bin/false
install nfsv4 /bin/false
install nfsd /bin/false
install afs /bin/false
install kafs /bin/false
install ceph /bin/false
install coda /bin/false

# Direct memory access from a plugged-in device (X6): FireWire and Thunderbolt can read memory past the OS.
install firewire-core /bin/false
install firewire-ohci /bin/false
install firewire-sbp2 /bin/false
install firewire-net /bin/false
install ohci1394 /bin/false
install sbp2 /bin/false
install thunderbolt /bin/false
install thunderbolt_net /bin/false
install intel-wmi-thunderbolt /bin/false
# Bluetooth: a radio way in that nothing here uses (OS-THREATS H16).
install bluetooth /bin/false
install btusb /bin/false
# USB network adapters that pretend to be phones: a plugged-in device would become a network route.
install rndis_host /bin/false
install usb_f_rndis /bin/false
# GPS receivers, test-only video drivers, floppy disks and CD drives: no such hardware here.
install gnss /bin/false
install vivid /bin/false
install floppy /bin/false
install cdrom /bin/false
install sr_mod /bin/false
# The PC speaker and raw USB keyboard or mouse drivers, which bypass the normal input stack.
install pcspkr /bin/false
install usbkbd /bin/false
install usbmouse /bin/false
