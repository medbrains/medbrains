# The MedBrains OS installer: one boot file (a UKI) that holds a small Debian system in its initrd and
# writes the OS image from the same USB stick or DVD to a disk the operator names. os/build-iso.sh builds it
# and wraps it, with the image, into the .iso. Nothing here reaches the installed system: the disk it writes
# is the release .raw, byte for byte, so the PCR-signed boot file on it is untouched.
[Distribution]
Distribution=debian
Release=trixie

[Output]
# The whole system is the boot file's initrd, so it runs from memory and never mounts a disk it may erase.
Format=uki
ImageId=medbrains-installer
CompressOutput=no

[Content]
# rdinit: start systemd from the initrd as the whole system. With no /etc/initrd-release it does not switch root.
# systemd.firstboot=off: a fresh system otherwise stops on the screen to ask for a locale and a root password.
KernelCommandLine=rdinit=/sbin/init systemd.firstboot=off quiet loglevel=3 systemd.show_status=auto udev.log_level=3 vt.global_cursor_default=1
WithDocs=no
Locale=C.UTF-8
Hostname=medbrains-installer
Packages=
        systemd
        systemd-sysv
        udev
        util-linux
        eject
        coreutils
        zstd
        kmod
        efibootmgr
        # mkosi installs systemd-boot into every bootable image, even a UKI that is booted directly.
        systemd-boot-efi
# Only drivers for reaching disks, a keyboard and the installer medium: the system lives in memory.
KernelModulesExclude=.*
KernelModulesInclude=
        default
        ^drivers/ata/
        ^drivers/nvme/
        ^drivers/scsi/
        ^drivers/message/fusion/
        ^drivers/block/
        ^drivers/mmc/
        ^drivers/usb/
        ^drivers/hid/
        ^drivers/input/
        ^drivers/cdrom/
        ^drivers/virtio/
        ^drivers/hv/
        ^drivers/md/
        ^fs/isofs/
        ^fs/nls/
RemoveFiles=
        /usr/share/doc
        /usr/share/man
        /usr/share/info
        /usr/share/locale
        /var/cache
        /var/log
        /usr/lib/systemd/catalog
        /usr/lib/udev/hwdb.d
        # Debian's own initrd for this kernel: the installer is the initrd.
        /boot/initrd.img*
