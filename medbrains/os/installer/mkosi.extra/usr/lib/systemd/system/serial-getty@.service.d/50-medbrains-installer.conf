# The installer in place of a login prompt, on the screen and on every serial console the kernel uses.
# There is no login in the installer: root is locked and nothing else runs.
[Service]
ExecStart=
ExecStart=/usr/lib/medbrains/installer
StandardInput=tty
StandardOutput=tty
StandardError=tty
TTYPath=/dev/%I
TTYReset=yes
TTYVHangup=yes
Environment=TERM=linux
Restart=always
RestartSec=1s
