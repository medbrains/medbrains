[Match]
Architecture=x86-64

[Content]
Packages=linux-image-amd64
# The IOMMU on from the first instruction, with each device isolated and no early DMA before it is ready.
KernelCommandLine=intel_iommu=on amd_iommu=force_isolation iommu=force efi=disable_early_pci_dma
# No legacy vsyscall page at a fixed address (a classic exploit target), and no 32-bit programs at all.
KernelCommandLine=vsyscall=none ia32_emulation=0
# Kernel crash records never go to the firmware's ACPI error store, where they would outlive the boot.
KernelCommandLine=erst_disable
# Intel TSX off: the TAA side channel goes with it, and nothing here needs transactional memory.
KernelCommandLine=tsx=off
# tty1 last: the machine's own screen stays /dev/console, where the recovery key prompt appears.
KernelCommandLine=console=ttyS0 console=tty1
