# MedBrains OS (D1): Debian stable + PostgreSQL + one server binary + the web
# app + an appliance screen. Built by ./build.sh (or `make os-image`), which
# stages the server binary and web assets into a second extra tree.
# RFC-HOSPITAL-OS §3a, §8b, §8k, §8n; docs/architecture/HOSPITAL-OS-ARCHITECTURE.md §7.

[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=disk
ImageId=medbrains-os
CompressOutput=no

[Build]
WithNetwork=yes

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
# root= is added by build.sh and names this version's partition, so each boot file can only start its own
# system: finding the root by partition type always takes the newest, which would defeat rollback.
# panic=10 restarts a kernel that dies, so a bad update uses up its starts instead of hanging. A quiet screen that still shows
# failures: tty1 is last, so it is /dev/console, where systemd reports failures and the
# emergency message lands; show_status=auto prints nothing unless something goes wrong.
KernelCommandLine=rw panic=10 lockdown=integrity init_on_alloc=1 slab_nomerge randomize_kstack_offset=on page_alloc.shuffle=1 console=ttyAMA0 console=tty1 quiet loglevel=3 systemd.show_status=auto rd.systemd.show_status=auto udev.log_level=3 rd.udev.log_level=3 vt.global_cursor_default=0
WithDocs=no
Locale=C.UTF-8
Hostname=medbrains
# No root password and no SSH: the appliance is managed from its web console.
# A debug build (./build.sh --debug) adds a root shell on the serial port for verification.
Packages=
        systemd
        systemd-sysv
        systemd-boot
        systemd-boot-efi
        systemd-resolved
        chrony
        nftables
        systemd-repart
        udev
        dbus
        libpam-systemd
        kmod
        e2fsprogs
        iproute2
        procps
        curl
        openssl
        ca-certificates
        fdisk
        zstd
        postgresql-17
        postgresql-client-17
        caddy
        cage
        libgtk-4-1
        libwebkitgtk-6.0-4
        librsvg2-common
        iputils-ping
        iwd
        wireless-regdb
        tzdata
        wlr-randr
        fontconfig
        fonts-dejavu-core
        libgl1-mesa-dri
        libegl1
        libgles2
        at-spi2-core
        gstreamer1.0-plugins-base
        gstreamer1.0-plugins-good
        glib-networking
# For mkosi.build.chroot only; not in the image.
BuildPackages=
        gcc
        libc6-dev
        pkgconf
        rustc
        cargo
        ca-certificates
        libgtk-4-dev
        libwebkitgtk-6.0-dev
RemoveFiles=
        /usr/share/doc
        /usr/share/man
        /usr/share/info
        /usr/share/lintian
        /usr/share/locale
