# System slot A. Fixed size so slot B (below) can take the same image on update. Its name is its version,
# which the boot file's root= looks for and the updater reads (OS-UPDATES.md).
# D1: ext4, mounted read-write. SEC3 turns this into erofs + a dm-verity hash
# partition (add Verity=data here and a root-verity partition) — /etc and /var
# already keep no writable state the appliance needs (see README).
[Partition]
Type=root
Label=medbrains_%A
Format=ext4
CopyFiles=/
ExcludeFiles=/var/
SizeMinBytes=2G
SizeMaxBytes=2G
