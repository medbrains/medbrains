# System slot A. Fixed size so slot B (below) can take the same image on update. Its name is its version,
# which the updater reads (OS-UPDATES.md). Read-only, sealed by dm-verity (OS-VERITY.md): the hash tree is in
# the next partition, and the boot file carries its root hash, so a boot file starts only its own system.
# repart names both partitions after that hash: the first half of it is this partition's UUID.
# Keeps a copy of the image's /var: disk-setup seeds the encrypted data partition from it on first
# boot, and from then on it sits hidden under the mount. It holds no secrets.
[Partition]
Type=root
Label=medbrains_%A
Format=ext4
CopyFiles=/
Verity=data
VerityMatchKey=root
SizeMinBytes=2G
SizeMaxBytes=2G
