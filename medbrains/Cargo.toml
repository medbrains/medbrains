[workspace]
resolver = "2"
members = [
    "crates/medbrains-server",
    "crates/medbrains-core",
    "crates/medbrains-db",
    "crates/medbrains-abdm",
    "crates/medbrains-loadtest",
    "crates/medbrains-adapter-sdk",
    "crates/medbrains-bridge",
    "crates/medbrains-print",
    "crates/medbrains-proxy",
    "crates/medbrains-authz",
    "crates/medbrains-crypto",
    "crates/medbrains-fhir",
    "crates/medbrains-outbox",
    "crates/medbrains-db-topology",
    "crates/medbrains-edge",
    "crates/medbrains-edge-rn",
    "crates/medbrains-fhir",
    "crates/medbrains-offline-core",
    "crates/medbrains-seed",
    "crates/medbrains-server-core",
    "crates/medbrains-server-services",
    "crates/medbrains-custom-code",
    "crates/medbrains-lms",
    "crates/medbrains-cssd",
    "crates/medbrains-ambulance",
    "crates/medbrains-microsite",
    "crates/medbrains-home-health",
    "crates/medbrains-diet",
    "crates/medbrains-emergency",
    "crates/medbrains-indent",
    "crates/medbrains-blood-bank",
    "crates/medbrains-radiology",
    "crates/medbrains-tokens",
    "crates/medbrains-lab",
    "crates/medbrains-pharmacy",
    "crates/medbrains-camp",
    "crates/medbrains-opd",
    "crates/medbrains-ipd",
    "crates/medbrains-clinical-scores",
    "crates/medbrains-clinical-ops",
    "crates/medbrains-identity",
    "crates/medbrains-materials",
    "crates/medbrains-facilities",
    "crates/medbrains-documents",
    "crates/medbrains-infra-utils",
    "crates/medbrains-admin",
    "crates/medbrains-analytics",
    "crates/medbrains-platform",
    "crates/medbrains-nursing",
    "crates/medbrains-telehealth",
    "crates/medbrains-specialty",
    "crates/medbrains-care-mgmt",
    "crates/medbrains-infection-control",
    "crates/medbrains-workflow",
    "crates/medbrains-scheduling",
    "crates/medbrains-ancillary",
    "crates/medbrains-community-health",
    "apps/edge",
    "apps/desktop/src-tauri",
