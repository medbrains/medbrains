# Opt-in extras that exist only as container images. None is on the default
# install path: Postgres is native (native-postgres.sh), PDFs come from
# rustenberg, and install.sh never installs docker. Each service is
# profile-gated and starts only when the operator has turned it on in
# /etc/medbrains/env AND installed docker themselves (docs/DECISIONS.md,
# 2026-11-20, "Standalone kit off Docker").

services:
  # Optional WHO ICD-API local service for ICD-11 diagnosis coding.
  # Enable from /etc/medbrains/env:
  #   MEDBRAINS_ICD_LOCAL_SERVICE=true
  #   ICD_API_ACCEPT_LICENSE=true
  #   WHO_ICD_API_BASE_URL=https://<hospital-domain>
  #   WHO_ICD_AUTH_MODE=none
  icd-api:
    image: whoicd/icd-api:${ICD_API_IMAGE_TAG:-latest}
    profiles: ["icd"]
    container_name: medbrains-icd-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ICD_API_PORT:-8382}:80"
    environment:
      include: ${ICD_API_INCLUDE:-2026-01_en}
      acceptLicense: ${ICD_API_ACCEPT_LICENSE:-false}
      saveAnalytics: ${ICD_API_SAVE_ANALYTICS:-false}

  # Optional error tracker (Rustrak, Sentry-protocol compatible), started by
  # install-rustrak.sh when INSTALL_RUSTRAK=1. SQLite in the named volume, on
  # this host: error reports never leave the hospital's own server. Bound to
  # localhost; the Pingora edge serves its dashboard at errors.<domain>. The
  # image is pinned by tag AND digest — upgrade deliberately, never :latest.
  rustrak:
    image: rustrak/rustrak-server:v0.21.0@sha256:6b1547630a678f7fb7d8900c199461dd81a42e8af2b52c95a6ef48b7017af6cb
    profiles: ["rustrak"]
    container_name: medbrains-rustrak
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RUSTRAK_PORT:-8180}:8080"
    # The secrets come from install-rustrak.sh via .compose-env. `:-` rather
    # than `:?` because compose interpolates every service, profile or not;
    # an empty key is refused by Rustrak itself (SSL_PROXY=true requires a
    # 64-character SESSION_SECRET_KEY) and by install-rustrak.sh before it.
    environment:
      SESSION_SECRET_KEY: ${RUSTRAK_SESSION_SECRET_KEY:-}
      # Only creates the account when the database has none; ignored after.
      CREATE_SUPERUSER: ${RUSTRAK_CREATE_SUPERUSER:-}
      PUBLIC_URL: ${RUSTRAK_PUBLIC_URL:-}
      SSL_PROXY: "true"
      RUSTRAK_TELEMETRY: "off"
      DO_NOT_TRACK: "1"
      RUSTRAK_METRICS: "off"
      RUSTRAK_LOG_TIMEZONE: Asia/Kolkata
      # A small box: a runaway loop must not fill the disk.
      MAX_EVENTS_PER_MINUTE: "2000"
      MAX_EVENTS_PER_HOUR: "40000"
    volumes:
      - medbrains-rustrak:/data
    mem_limit: 256m

volumes:
  medbrains-rustrak:
    driver: local
