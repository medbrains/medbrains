# Postgres-first docker-compose for the standalone deploy kit.
# The Rust binary runs on the host (systemd), not in a container —
# the database is dockerised so backups + minor-version upgrades stay
# simple. Optional sidecars, such as WHO ICD-API, are profile-gated and
# started only when install.sh sees the matching env opt-in.
#
# YottaDB / Kiwi TCMS / SpiceDB from the dev compose are intentionally
# excluded — they're dev/test only and not needed for a hospital
# pilot.

services:
  # Headless-Chrome PDF rendering for server-side documents (bills,
  # labels, discharge summaries). Stateless; bound to localhost only.
  gotenberg:
    image: gotenberg/gotenberg:8.21
    container_name: medbrains-gotenberg
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GOTENBERG_PORT:-3005}:3000"
    command:
      - gotenberg
      - --api-timeout=30s
      - --chromium-restart-after=50
    mem_limit: 600m

  postgres:
    image: postgres:17-alpine
    container_name: medbrains-postgres
    restart: unless-stopped
    ports:
      # Bind to localhost only so the host firewall doesn't have to
      # think about postgres exposure. Pingora + the Rust server are
      # the only public entry points.
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medbrains}
      POSTGRES_USER: ${POSTGRES_USER:-medbrains}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in env}
    volumes:
      # Named volume — docker manages perms (uid 70 = postgres in
      # alpine). Bind mount to /var/lib/medbrains/pgdata fails
      # because host owner (medbrains uid) ≠ container postgres uid.
      - medbrains-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-medbrains}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional WHO ICD-API local service for ICD-11 diagnosis coding.
  # Enable from /etc/medbrains/env:
  #   MEDBRAINS_ICD_LOCAL_SERVICE=true
  #   ICD_API_ACCEPT_LICENSE=true
  #   WHO_ICD_API_BASE_URL=https://<hospital-domain>
  #   WHO_ICD_AUTH_MODE=none
  icd-api:
    image: whoicd/icd-api:${ICD_API_IMAGE_TAG:-latest}
    profiles: ["icd"]
    container_name: medbrains-icd-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ICD_API_PORT:-8382}:80"
    environment:
      include: ${ICD_API_INCLUDE:-2026-01_en}
      acceptLicense: ${ICD_API_ACCEPT_LICENSE:-false}
      saveAnalytics: ${ICD_API_SAVE_ANALYTICS:-false}

  # Optional: nightly logical-dump backup container. Cron picks it
  # up via the timer-based "medbrains-pg-backup.service" if
  # configured; commented out here because the install script
  # offers a separate runbook for backups.
  #
  # backup:
  #   image: prodrigestivill/postgres-backup-local
  #   ...

volumes:
  medbrains-pgdata:
    driver: local
