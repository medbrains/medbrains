apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "medbrains-server.fullname" . }}-config
  labels:
    {{- include "medbrains-server.labels" . | nindent 4 }}
data:
  MEDBRAINS_DOMAIN: {{ .Values.config.domain | quote }}
  MEDBRAINS_ADMIN_EMAIL: {{ .Values.config.adminEmail | quote }}
  RUST_LOG: {{ .Values.config.rustLog | quote }}
  PORT: {{ .Values.service.targetPort | quote }}
